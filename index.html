let _wrapYear=null,_wrapScope='own';
function setWrapYear(y){_wrapYear=y;renderYearWrapWidget();}
// Перемикача «Моє / Родина разом» у інтерфейсі немає (див. renderYearWrapWidget),
// тому й сеттера теж — гілка _wrapScope==='family' лишається робочою й чекає
// на етап «Друзі».
function computeYearWrap(books,yearKey){
  const yearBooks=books.filter(b=>bookPeriodKeys(b).year===yearKey);
  const count=yearBooks.length;
  if(!count)return null;
  const pages=yearBooks.reduce((s,b)=>s+(b.pages||0),0);
  const avgPages=Math.round(pages/count);
  const rated=yearBooks.filter(b=>b.rating);
  const avgRating=rated.length?Math.round((rated.reduce((s,b)=>s+b.rating,0)/rated.length)*10)/10:null;
  const shortestBook=yearBooks.reduce((m,b)=>(!m||(b.pages||0)<(m.pages||0))?b:m,null);
  const longestBook=yearBooks.reduce((m,b)=>(!m||(b.pages||0)>(m.pages||0))?b:m,null);
  // ties at the top rating go to whichever was read most recently
  let topRatedBook=null;
  if(rated.length){
    const maxRating=Math.max(...rated.map(b=>b.rating));
    topRatedBook=rated.filter(b=>b.rating===maxRating)
      .reduce((latest,b)=>(!latest||(b.ts||0)>(latest.ts||0))?b:latest,null);
  }
  const favLang=langBreakdown(yearBooks)[0]||null;
  const favGenre=genreBreakdown(yearBooks)[0]||null;
  const authorCounts={};
  yearBooks.forEach(b=>{
    const a=(b.author||'').trim();if(!a)return;
    const key=a.toLowerCase();
    if(!authorCounts[key])authorCounts[key]={name:a,count:0};
    authorCounts[key].count++;
  });
  const favAuthor=Object.values(authorCounts).sort((a,b)=>b.count-a.count)[0]||null;
  const monthCounts=Array(12).fill(0);
  yearBooks.forEach(b=>{
    const m=bookPeriodKeys(b).month;if(!m)return;
    monthCounts[parseInt(m.split('-')[1],10)-1]++;
  });
  let bestIdx=0;monthCounts.forEach((c,i)=>{if(c>monthCounts[bestIdx])bestIdx=i;});
  const bestMonth=monthCounts[bestIdx]>0?{idx:bestIdx,count:monthCounts[bestIdx]}:null;
  return{count,pages,avgPages,avgRating,shortestBook,longestBook,topRatedBook,favLang,favGenre,favAuthor,bestMonth};
}

  el.innerHTML=`<div class="stats-chart-card">${controls}${inProgressNote}${heroTiles}${bookCards}<div class="wrap-facts">${facts}</div>${bestMonthCard}</div>`;

  // Language/genre/location breakdowns are always all-time — only the tiles

function showChartTip(evt,value){
  const g=evt.currentTarget;
  const fill=g.querySelector('.bar-fill');
  const card=g.closest('.stats-chart-card');
  const tip=card.querySelector('.stats-chart-tooltip');
  const fr=fill.getBoundingClientRect(),cr=card.getBoundingClientRect();
  tip.textContent=value;
  tip.style.left=(fr.left+fr.width/2-cr.left)+'px';
  tip.style.top=(fr.top-cr.top)+'px';
  tip.style.display='block';
  clearTimeout(window._chartTipTimer);
  window._chartTipTimer=setTimeout(()=>{tip.style.display='none';},1500);
}

function maxByAuthor(d){

  {key:'longPlayer',title:'Довгограй',emoji:'📆',unit:'місяців з хоча б 1 книгою',tiers:[3,6,12,24],

// Жанровим ачівкам valueFn і desc робляться з поля genre: інакше назва
// жанру дублювалась би в трьох місцях і могла тихо розійтися з GENRES.
ACHIEVEMENTS.forEach(a=>{

function achievementTierInfo(a,d){
  const val=a.valueFn(d);
  let unlockedCount=0;
  for(const t of a.tiers){if(val>=t)unlockedCount++;else break;}
  const nextTier=a.tiers[unlockedCount];
  const pct=nextTier?Math.min(100,Math.round((val/nextTier)*100)):100;
  return{val,unlockedCount,totalTiers:a.tiers.length,nextTier,pct};
}
function achievementsTotals(d){
  let unlocked=0,total=0;
  ACHIEVEMENTS.forEach(a=>{const info=achievementTierInfo(a,d);unlocked+=info.unlockedCount;total+=info.totalTiers;});
  return{unlocked,total};
}
// Snapshot which achievements are FULLY maxed right now — call before and
// after a mutating action, then diff to find newly-completed ones (works for
// resettable achievements too, since valueFn is always recomputed live).
function fullyCompletedKeys(d){
  return new Set(ACHIEVEMENTS.filter(a=>{
    const info=achievementTierInfo(a,d);
    return info.unlockedCount>=info.totalTiers;
  }).map(a=>a.key));
}
function newlyCompletedAchievements(d,beforeSet){
  return ACHIEVEMENTS.filter(a=>{
    if(beforeSet.has(a.key))return false;
    const info=achievementTierInfo(a,d);
    return info.unlockedCount>=info.totalTiers;
  });
}

// Порядок у списку — це порядок появи в грі, він же порядок у пікері:

const DEFAULT_WALL='classic';
function wallById(id){return WALLS.find(w=>w.id===id)||WALLS[0];}
function wallForAch(key){return WALLS.find(w=>w.ach===key)||null;}
function achByKey(key){return key?ACHIEVEMENTS.find(a=>a.key===key):null;}
function wallAch(w){return w.ach?ACHIEVEMENTS.find(a=>a.key===w.ach):null;}
function wallUnlocked(d,w){
  if(!w.loc&&!w.ach)return true;
  if(!d)return false;
  if(w.loc)return (d.unlockedLocs||[]).includes(w.loc);
  const a=wallAch(w);
  return !!a&&a.valueFn(d)>=a.tiers[w.tier];
}
function unlockedWallIds(d){return WALLS.filter(w=>wallUnlocked(d,w)).map(w=>w.id);}
// Умова людською мовою: «🌲 Вірідіан» або «📖 10000 сторінок».
function wallReqText(w){
  if(w.loc){const l=LOCS[w.loc];return l?l.emoji+' '+l.mLabel:'';}
  const a=wallAch(w);
  return a?a.emoji+' '+a.tiers[w.tier]+' '+(w.unit||a.unit):'';
}
function curWall(){
  const d=pd();
  const w=wallById((d&&d.wall)||DEFAULT_WALL);
  return wallUnlocked(d,w)?w:WALLS[0];   // арт зник із відкритих — вертаємось на старт

function applyWall(){

// Арт на весь екран, БЕЗ заслінки: у грі він навмисно приглушений, тож
// інакше подивитись на нього ніде.
let _wallFsList=[],_wallFsIdx=0;
function openWallPreview(id){
  const d=pd();const w=wallById(id);

}
function _wallFsRender(){
  const el=document.getElementById('wall-fs');if(!el)return;

    '<div class="wall-fs-img" style="background-image:url(\''+w.file+'.webp\')"></div>'+

          '<button class="wall-fs-arrow r" aria-label="Наступні" onclick="wallFsGo(1)">›</button>':'')+
    '<div class="wall-fs-bar">'+
      '<div class="wall-fs-nm">'+w.name+
        (many?'<i>'+(_wallFsIdx+1)+' з '+_wallFsList.length+'</i>':'')+'</div>'+
      (isCur
        ?'<div class="wall-fs-cur">✓ Твої обої</div>'
        :'<button class="btn-ok" onclick="setWall(\''+w.id+'\');closeWallPreview()">Поставити</button>')+
      '<button class="btn-cancel" onclick="closeWallPreview()">Закрити</button>'+
    '</div>';
}
function wallFsGo(step){
  if(_wallFsList.length<2)return;
  _wallFsIdx=(_wallFsIdx+step+_wallFsList.length)%_wallFsList.length;
  _wallFsRender();
}
// Свайп і стрілки. Клік по тлу закриває, але тільки якщо це справді клік,
// а не кінець свайпу — інакше гортання щоразу зачиняло б прев'ю.
function _wallFsBind(){
  const el=document.getElementById('wall-fs');if(!el)return;
  let x0=null,y0=null,moved=false;
  const start=e=>{const t=e.touches?e.touches[0]:e;x0=t.clientX;y0=t.clientY;moved=false;};
  const move=e=>{if(x0===null)return;const t=e.touches?e.touches[0]:e;
    if(Math.abs(t.clientX-x0)>10||Math.abs(t.clientY-y0)>10)moved=true;};
  const end=e=>{
    if(x0===null)return;
    const t=(e.changedTouches?e.changedTouches[0]:e);
    const dx=t.clientX-x0,dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){wallFsGo(dx<0?1:-1);moved=true;}
  };
  el.addEventListener('touchstart',start,{passive:true});
  el.addEventListener('touchmove',move,{passive:true});
  el.addEventListener('touchend',end);
  el.addEventListener('mousedown',start);
  el.addEventListener('mousemove',move);
  el.addEventListener('mouseup',end);
  el.addEventListener('click',e=>{
    if(moved){moved=false;return;}
    if(e.target===el||e.target.classList.contains('wall-fs-img'))closeWallPreview();
  });
  el._wallKeys=e=>{
    if(e.key==='ArrowRight')wallFsGo(1);
    else if(e.key==='ArrowLeft')wallFsGo(-1);
    else if(e.key==='Escape')closeWallPreview();
  };
  document.addEventListener('keydown',el._wallKeys);
}
function closeWallPreview(){
  const el=document.getElementById('wall-fs');if(!el)return;
  if(el._wallKeys)document.removeEventListener('keydown',el._wallKeys);
  el.remove();
}
function setWall(id){
  const d=pd();if(!d)return;
  const w=wallById(id);
  if(!wallUnlocked(d,w))return;   // клік по замку нічого не робить
  d.wall=w.id;
  applyWall();
  saveToCloud(cur);
  // перемальовуємо ЛИШЕ налаштування: з модалки «Нові обої» цей же
  // setWall викликається кнопкою «Поставити», і підміняти її вміст не можна.
  if(document.getElementById('ps-walls'))openProfileSettings();
}
// Що вже показали — лежить у сейві списком, а не рахується щоразу:
// інакше модалка загубиться, якщо гру закрили до того, як її побачили.
// noSave — для виклику на ВХОДІ в гру. Там зберігати нельзя: свій saveToCloud
// поставив би локальній копії свіжу мітку `_ts` ще до того, як bootSync звірить
// її з хмарою, і локальне після цього завжди вигравало б — вибір обоїв з
// іншого пристрою приїжджав і одразу затирався. У грі (після ачівки) сейв
// потрібен і лишається.
function checkWallUnlocks(noSave){
  const d=pd();if(!d)return[];
  if(!d.wallsSeen)d.wallsSeen=[DEFAULT_WALL];
  const fresh=WALLS.filter(w=>wallUnlocked(d,w)&&!d.wallsSeen.includes(w.id));
  if(!fresh.length)return[];
  fresh.forEach(w=>d.wallsSeen.push(w.id));
  if(!noSave)saveToCloud(cur);
  return fresh;
}
// ── обої за локацію вручаються В ТОМУ Ж попапі, що й сама локація ──
// Раніше вони їхали окремою модалкою через celebrateNewWalls(), а та
// викликалась ЛИШЕ з celebrateNewAchievements(). Тому обої за локацію
// чекали найближчої ачівки й вилітали під випадкову дію — «додав книгу, а
// мені обої за печери». А з магазину (найчастіший шлях відкриття локації!)
// їх не показувало взагалі: buyChainStage має власну чергу й celebrateNewWalls
// не кликав ніколи.
function wallForLoc(locId){return WALLS.find(w=>w.loc===locId)||null;}

// Забирає обої «в руки»: якщо вони справді відкриті й ще не показані —
// позначає показаними й повертає. Інакше null. Позначаємо саме тут, щоб
// celebrateNewWalls() не вручив ті самі обої вдруге окремою модалкою.
function takeWall(w){
  const d=pd();if(!d||!w)return null;
  if(!d.wallsSeen)d.wallsSeen=[DEFAULT_WALL];
  if(!wallUnlocked(d,w)||d.wallsSeen.includes(w.id))return null;
  d.wallsSeen.push(w.id);
  return w;
}

// Пара «локація + її обої» на кожну щойно відкриту локацію.
// САМ НЕ ЗБЕРІГАЄ — і це навмисно. Свій saveToCloud тут ставив мітку часу
// `_ts` на локальну копію ще до того, як bootSync звірить її з хмарою, і
// локальне після цього ВСЕГДА вигравало: вибір обоїв з іншого пристрою
// приїжджав і одразу затирався. Тому виклик іде ПЕРЕД наявним saveToCloud
// у doCatch/buyChainStage і їде разом з ним, а на вході в гру не зберігає
// нічого — точно як checkUnlocks() до цього.
function openedWithWalls(opened){
  return(opened||[]).map(loc=>({loc:loc,wall:takeWall(wallForLoc(loc.id))}));
}

// Вміст попапа «відкрито локацію». Є обої — арт стоїть згори, а медальйон
// локації налазить на нього знизу: одразу видно і що відкрилось, і що за це

// Ставить попапи в чергу. Викликати НЕГАЙНО після checkUnlocks(), у тому

function wallCardHTML(w,d,act){

function _achievementCelebrationContentHTML(a){

function _lerpColor(hex1,hex2,t){
  const c1=parseInt(hex1.slice(1),16),c2=parseInt(hex2.slice(1),16);
  const r1=(c1>>16)&255,g1=(c1>>8)&255,b1=c1&255;
  const r2=(c2>>16)&255,g2=(c2>>8)&255,b2=c2&255;
  const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);
  return`#${((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}`;
}

// Читач = рядок у таблиці Users на сервері, сейв у хмару, працює з будь-якого
// девайса. Гість = тільки localStorage цього браузера, на сервері його немає
// взагалі. Підвищення гостя до читача — інвайт-код у openClaim().
const LS_SESSION='rw_session';
const LS_GUESTS='rw_guests';

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}

// ═══════════ ТЕМИ (кольорові гами) ═══════════
// id мусить збігатися з html[data-theme="…"] у <style>. 'night' лежить
// у :root, тому їй атрибут не потрібен — вона й є значення за замовчуванням.
// sw — три кольори для мініатюри в налаштуваннях: тло, акцент, текст.
// Тема належить профілю (d.theme), тобто в кожного своя і їде за ним на
// інший пристрій. У localStorage лежить копія — щоб застосувати гаму до
// першого малювання і не блимнути чужими кольорами на екрані входу.
const LS_THEME='rw_theme';
const THEMES=[
  {id:'night', name:'Ніч',    desc:'Темно-синя — як було',       sw:['#16213e','#7eceff','#e2e8f0']},
  {id:'day',   name:'День',   desc:'Світла, білий папір екрана', sw:['#f6f8fc','#0369a1','#0f172a']},
  {id:'ocean', name:'Океан',  desc:'Блакитна й прохолодна',      sw:['#eaf5fd','#0284c7','#062b45']},
  {id:'paper', name:'Папір',  desc:'Тепла, як стара книжка',     sw:['#f7efe0','#8a5a24','#2e2318']},
  {id:'forest',name:'Ліс',    desc:'Темно-зелена, для вечора',   sw:['#0c2118','#6ee7b7','#e3f0e7']},
  {id:'plum',  name:'Слива',  desc:'Темно-фіолетова',            sw:['#1c1030','#d8b4fe','#ede4f7']},
];
function themeById(id){return THEMES.find(t=>t.id===id)||null;}
// Єдине місце, де тема реально вмикається. Повертає id, який застосувався:
// невідоме (стара збірка, зіпсований localStorage) тихо падає на 'night'.
function applyTheme(id){
  const t=themeById(id)?id:'night';
  const root=document.documentElement;
  if(t==='night')root.removeAttribute('data-theme');
  else root.setAttribute('data-theme',t);
  lsSet(LS_THEME,t);
  return t;
}
// Профіль важливіший за пристрій: увійшов зі своїм профілем — бачиш свою гаму,
// навіть якщо на цьому пристрої останнім сидів хтось інший. Тому копія з
// localStorage годиться тільки до входу (екран входу, перше малювання):
// в профілі без гами — базова, а не та, що лишив попередній гравець.
function curTheme(){
  if(cur){
    const d=state.players[cur];
    return(d&&themeById(d.theme))?d.theme:'night';
  }
  const ls=lsGet(LS_THEME,'');
  return themeById(ls)?ls:'night';
}
function themeCardHTML(t,act){
  const bg=t.sw[0],acc=t.sw[1],txt=t.sw[2];
  return`<div onclick="pickTheme('${t.id}')" role="button" aria-label="Гама ${t.name}" title="${t.desc}"
      style="flex:0 0 auto;width:74px;cursor:pointer;text-align:center">
    <div style="height:54px;border-radius:10px;overflow:hidden;background:${bg};padding:7px 7px 0;box-sizing:border-box;
        border:2px solid ${act?acc:'rgba(var(--ink),.14)'}">
      <div style="height:7px;border-radius:3px;background:${acc};margin-bottom:6px"></div>
      <div style="height:6px;border-radius:3px;background:${txt};opacity:.8;margin-bottom:5px"></div>
      <div style="height:6px;width:65%;border-radius:3px;background:${txt};opacity:.45"></div>
    </div>
    <div style="font-size:10px;font-weight:700;margin-top:5px;color:${act?'var(--accent)':'var(--txt-3)'}">${act?'✓ ':''}${t.name}</div>

// Перемальовувати гру не треба: і CSS, і inline-стилі беруть кольори через
// var(--…), тому вже намальований екран перефарбовується сам. Оновлюємо лише
// самі картки — інакше довелось би перебудовувати модалку й губити
// недописаний нік у полі поруч.
function pickTheme(id){
  const t=applyTheme(id);
  const d=pd();
  if(d){d.theme=t;saveToCloud(cur);}
  const row=document.getElementById('ps-themes');
  if(row)row.innerHTML=THEMES.map(x=>themeCardHTML(x,x.id===t)).join('');
  const note=document.getElementById('ps-theme-note');
  if(note)note.textContent=themeById(t).desc;
  showToast('Гама «'+themeById(t).name+'»');
}

// Усе, що містить пароль або токен, ходить через POST — у GET параметри
// потрапили б в історію браузера і в логи виконання Apps Script.
// Таймаут обов'язковий, і не заради ввічливості. Рейс у хмару йде ПО ОДНОМУ
// на гравця (_saveBusy), тому запит, який не завершується ніколи, назавжди
// глушить усі наступні збереження: прапорець не знімається, а індикатор
// лишається на 💾 — тобто виглядає як «зберігаю», а не як «зламалось».
// 30 с із запасом перекривають холодний старт Apps Script (там секунди).
const API_TIMEOUT=30000;
async function _api(payload){
  if(!SCRIPT_URL)return{error:'no-backend'};
  // AbortSignal.timeout немає в Safari до 16 — там лишаємось без таймауту,
  // як було, замість того щоб упасти на самому виклику.
  let signal;
  try{signal=AbortSignal.timeout(API_TIMEOUT);}catch(e){signal=undefined;}
  try{
    const res=await fetch(SCRIPT_URL,{
      method:'POST',
      body:JSON.stringify(payload),
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      signal:signal,
    });
    return await res.json();
  }catch(e){
    console.error('[API]',payload.action,e);
    return{error:'network'};
  }
}

// crypto.subtle існує лише в захищеному контексті (https або localhost).
// Якщо сторінку відкрили як file:// — гостьові паролі порахувати нічим,
// і краще сказати це прямо, ніж залишити кнопку висіти.
function cryptoOk(){return !!(window.crypto&&window.crypto.subtle);}
async function _sha256(s){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── гості (локально) ──────────────────────────────────────────
function guestKey(nick){return 'rw_guest_'+String(nick).trim().toLowerCase();}
function guestRec(nick){return lsGet(guestKey(nick),null);}
async function guestCreate(nick,password){
  const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
  const rec={userId:'g_'+salt.slice(0,10),nick:String(nick).trim(),salt,
             hash:await _sha256(salt+'|'+password)};
  lsSet(guestKey(nick),rec);
  const idx=lsGet(LS_GUESTS,[]);
  if(idx.indexOf(rec.userId)<0){idx.push(rec.userId);lsSet(LS_GUESTS,idx);}
  return rec;
}
async function guestCheck(nick,password){
  const rec=guestRec(nick);
  if(!rec)return null;
  return(await _sha256(rec.salt+'|'+password))===rec.hash?rec:null;
}

// ── валідація (дзеркало серверної, щоб не ганяти запит даремно) ──
function badNickC(n){
  n=String(n||'').trim();
  if(n.length<2)return'Нік занадто короткий';
  if(n.length>20)return'Нік занадто довгий (до 20 символів)';
  if(!/^[A-Za-zА-Яа-яЁёЇїІіЄєҐґ0-9 _.-]+$/.test(n))return'У ніку є недопустимі символи';
  return null;
}
function badPassC(p){
  if(String(p||'').length<4)return'Пароль занадто короткий (мінімум 4 символи)';
  return null;
}

    <button class="login-tab ${_loginTab==='new'?'act':''}" onclick="setLoginTab('new')">Новий гравець</button>
  </div><div class="login-err" id="login-err"></div>`;
  const enter=`onkeydown="if(event.key==='Enter')document.getElementById('login-submit').click()"`;
  const body=_loginTab==='in'
    ?`<div class="flbl">Нік</div>
      <input type="text" id="li-nick" class="finput" autocomplete="username" maxlength="20" ${enter}>
      <div class="flbl">Пароль</div>
      ${pwField('li-pass','current-password',enter)}
      <button class="login-btn" id="login-submit" data-label="Увійти" onclick="submitLogin()">Увійти</button>`
    :`<div class="flbl">Нік</div>
      <input type="text" id="rg-nick" class="finput" autocomplete="username" maxlength="20" ${enter}>
      <div class="flbl">Пароль</div>
      ${pwField('rg-pass','new-password',enter)}
      <div class="flbl">Код запрошення (якщо є)</div>
      <input type="text" id="rg-inv" class="finput" placeholder="XXXX-XXXX" maxlength="12" ${enter}>
      <div class="login-warn">⚠️ Без коду запрошення ти граєш як гість: прогрес зберігається лише в цьому браузері на цьому пристрої. Якщо очистити дані браузера — все зникне. Код можна ввести й пізніше.</div>
      <button class="login-btn" id="login-submit" data-label="Створити профіль" onclick="submitRegister()">Створити профіль</button>`;
  document.getElementById('login-body').innerHTML=tabs+body;
}

async function submitLogin(){
  const nick=_v('li-nick'),pass=_v('li-pass');
  if(!nick||!pass){loginErr('Введи нік і пароль');return;}
  loginErr('');
  loginBusy(true,'Вхід…');
  // Локальний гість перевіряється першим — це працює навіть без мережі.
  const g=cryptoOk()?await guestCheck(nick,pass):null;
  if(g){finishGuest(g);return;}
  const r=await _api({action:'login',nick:nick,password:pass});
  if(r&&r.ok){await finishReader(r);return;}
  loginBusy(false);
  loginErr(r&&r.error==='network'
    ?"Немає зв'язку з сервером"
    :(r&&r.error)||'Не вдалося увійти');
}

async function submitRegister(){
  const nick=_v('rg-nick'),pass=_v('rg-pass'),inv=_v('rg-inv');
  const err=badNickC(nick)||badPassC(pass);
  if(err){loginErr(err);return;}
  loginErr('');
  if(inv){
    loginBusy(true,'Створення…');
    const r=await _api({action:'register',nick:nick,password:pass,invite:inv});
    if(r&&r.ok){await finishReader(r);return;}
    loginBusy(false);
    loginErr(r&&r.error==='network'
      ?"Немає зв'язку з сервером"
      :(r&&r.error)||'Не вдалося створити профіль');
    return;
  }
  if(!cryptoOk()){loginErr('Профіль гостя тут створити не вийде — відкрий гру за посиланням (https). З кодом запрошення працює.');return;}
  if(guestRec(nick)){loginErr('Профіль з таким ніком уже є на цьому пристрої');return;}
  const g=await guestCreate(nick,pass);
  finishGuest(g);
}

async function finishReader(r){
  me={userId:r.userId,nick:r.nick,role:r.role||'reader',token:r.token,guest:false};
  lsSet(LS_SESSION,me);
  await loadStateFor(me.userId,true);
  enterGame();
}

function finishGuest(g){
  me={userId:g.userId,nick:g.nick,role:'guest',token:null,guest:true};
  lsSet(LS_SESSION,me);
  loadStateFor(me.userId,false);
  enterGame();
}

// Хмара НЕ затирає локальне беззастережно: якщо гравець грав офлайн, його
// сейв новіший за хмарний, і сліпе накладання з'їло б увесь той прогрес.
// Порівнюємо мітку _ts, яку ставить saveToCloud. Якщо мітки немає хоча б з
// одного боку (сейв створений до цієї зміни) — поводимось як раніше й
// віримо хмарі: вона там точно не старіша за міграцію.
// `pre` — сейв, який уже приїхав чужим рейсом (bootSync бере його разом із
// сесією). Немає — ходимо по нього самі, як раніше.
async function loadStateFor(userId,tryCloud,pre){
  initState(userId);
  const local=lsGet('rpg_state_'+userId,null);
  if(local)state.players[userId]=Object.assign({},state.players[userId],local);
  // Переносимо старий формат дати ДО всього іншого — і локальну копію, і
  // хмарну, бо новішою може виявитись будь-яка з них.
  let mig=migrateBookDates(state.players[userId]);
  const keepLocal=()=>{
    if(mig)saveLocal('rpg_state_'+userId,JSON.stringify(state.players[userId]));
  };
  if(!(tryCloud&&me&&me.token)){keepLocal();return;}
  const r=pre||await _api({action:'load',userId:userId,token:me.token});
  // Локальна копія лишається робочою, але сказати про причину треба:
  // інакше пошкоджений сейв виглядає як «просто нічого не підтяглось».
  if(r&&r.error&&r.error!=='auth'&&r.error!=='network')showToast(r.error);
  if(!(r&&r.ok&&r.state&&Object.keys(r.state).length>0)){keepLocal();return;}
  // Порівнюємо і зі знімком ДО запиту, і з тим, що в пам'яті ЗАРАЗ: поки
  // хмарний сейв їхав, людина могла додати книгу, і ця книга новіша за все.
  const cloudTs=+r.state._ts||0;
  const localTs=Math.max((local&&+local._ts)||0,+((state.players[userId]||{})._ts)||0);
  if(localTs&&cloudTs&&localTs>cloudTs){
    // Локальне новіше — лишаємо його й одразу лікуємо розбіжність у хмарі.
    console.log('[Load] локальний сейв новіший за хмарний, заливаю нагору',localTs,'>',cloudTs);
    await saveToCloud(userId);
    return;
  }
  state.players[userId]=Object.assign({},state.players[userId],r.state);
  mergeCovers(state.players[userId],r.covers);
  // Обої: хмара могла принести і свій d.wall, і свій список показаних.
  // enterGame() працював з локальною копією, тому застосовуємо ще раз.
  const _wd=state.players[userId];
  if(!_wd.wallsSeen)_wd.wallsSeen=unlockedWallIds(_wd);
  if(userId===cur)applyWall();
  if(migrateBookDates(state.players[userId]))mig=true;
  saveLocal('rpg_state_'+userId,JSON.stringify(state.players[userId]));
  // Перенесене треба один раз відправити нагору, інакше в хмарі `date`
  // лежатиме вічно й місце не звільниться. БЕЗ await: інакше вхід у гру
  // чекає ще один запит до сервера (це й були ті «довго завантажується»).
  if(mig)saveToCloud(userId);
}

function enterGame(){
  cur=me.userId;
  setPlayers(me.userId,me.nick);
  initState(cur);
  applyTheme(curTheme());   // гама профілю, а не та, що лишилась на пристрої
  const _d=state.players[cur]||{};
  if(_d.libView==='genre'){_libViewMode='journey';_libPath='genre';}          // стара назва вигляду
  else if(['shelves','wall','journey'].includes(_d.libView))_libViewMode=_d.libView;
  if(['size','genre','author'].includes(_d.libSort))_libSortBy=_d.libSort;
  if(['date','genre'].includes(_d.libPath))_libPath=_d.libPath;
  // Старий сейв без обоїв: усе вже заслужене вважаємо показаним, інакше
  // на першому ж вході прилетіла б купа модалок за минулі заслуги.
  if(!_d.wallsSeen)_d.wallsSeen=unlockedWallIds(_d);
  applyWall();
  renderGuestBar();
  friendsData={friends:[],incoming:[],outgoing:[],reax:[]};
  if(!me.guest){
    // Спершу викладаємо свій зліпок, потім забираємо друзів — обидва тихо,
    // у фоні. Без pushPublic картка в друзів висіла б порожньою («щойно
    // приєднався») аж до моменту, коли ти щось зробиш у грі.
    pushPublic();
    loadFriends(true);
  }
  // Результат checkUnlocks() тут раніше просто викидався: локація відкривалась
  // МОВЧКИ, а її обої лишались непоказаними — і вилітали потім під випадкову
  // дію. Тепер показуємо на вході, а celebrateNewWalls() підбирає хвіст
  // (наприклад, обої за ачівку, зароблені на іншому пристрої): усе, що
  // залишилось невручене, вручається ТУТ, а не колись у грі.
  celebrateOpenedLocs(checkUnlocks());
  celebrateNewWalls(true);   // true = не зберігати, див. checkWallUnlocks
  renderMain();
  show('screen-main');
  setMainTab('map');
  checkGoalEvents();
}

// Гра вже відкрита з локальної копії. Тепер тихо перевіряємо сесію й
// забираємо хмарний сейв; якщо він новіший — перемальовуємо. Токен помер —
// відправляємо на вхід, але дані на пристрої лишаються цілі.
async function bootSync(){
  if(!me||me.guest||!me.token)return;
  // Сейв просимо ТИМ САМИМ рейсом: раніше старт чекав `session`, а вже потім
  // `load`, і на холодному Apps Script це були два очікування замість одного.
  // Старий бекенд прапорця не знає й сейву не поверне — тоді ходимо окремо.
  const r=await _api({action:'session',userId:me.userId,token:me.token,withState:1});
  if(r&&r.error==='auth'){
    localStorage.removeItem(LS_SESSION);
    me=null;showLogin();
    showToast('Сесія закінчилась — увійди знову');
    return;
  }
  if(!(r&&r.ok))return;              // немає зв'язку — граємо з локального
  me.nick=r.nick;me.role=r.role;
  lsSet(LS_SESSION,me);
  const before=JSON.stringify(state.players[me.userId]||{});
  const pre=r.state!==undefined||r.stateError
    ?{ok:true,state:r.state,covers:r.covers,error:r.stateError}:null;
  await loadStateFor(me.userId,true,pre);
  if(JSON.stringify(state.players[me.userId]||{})===before)return;
  // Хмара принесла інше (грали з іншого пристрою) — перемальовуємо видиме.
  applyTheme(curTheme());
  // Те саме, що й у enterGame: хмарний сейв міг долити прогрес, якого
  // вистачає на нову локацію. Вручаємо одразу, а не відкладаємо на випадкову
  // дію в грі.
  celebrateOpenedLocs(checkUnlocks());
  celebrateNewWalls(true);   // true = не зберігати, див. checkWallUnlocks
  renderMain();
  setMainTab(_mainTab||'map');
}

// Автовхід: сесія лежить у localStorage, тому на своєму пристрої
// логінитись доводиться один раз.
async function boot(){
  const s=lsGet(LS_SESSION,null);
  if(!s||!s.userId){showLogin();return;}
  if(s.guest){
    const rec=guestRec(s.nick);
    if(!rec){showLogin();return;}   // дані браузера почистили — гість зник
    finishGuest(rec);
    return;
  }
  me={userId:s.userId,nick:s.nick,role:s.role,token:s.token,guest:false};
  // Є локальна копія — відкриваємо гру ОДРАЗУ, а сервер перевіряємо у фоні.
  // Раніше кожен запуск чекав два запити до Apps Script підряд (сесія, потім
  // сейв), а це секунд шість на холодному скрипті — саме воно й виглядало
  // як «довго завантажується».
  if(lsGet('rpg_state_'+s.userId,null)){
    await loadStateFor(me.userId,false);
    enterGame();
    bootSync();
    return;
  }
  renderLoginLoading();
  show('screen-select');
  const r=await _api({action:'session',userId:s.userId,token:s.token});
  if(r&&r.ok){
    me.nick=r.nick;me.role=r.role;
    lsSet(LS_SESSION,me);
    await loadStateFor(me.userId,true);
    enterGame();
    return;
  }
  if(r&&r.error==='auth'){
    localStorage.removeItem(LS_SESSION);
    me=null;showLogin();
    showToast('Сесія закінчилась — увійди знову');
    return;
  }
  // Сервер недоступний: якщо локальна копія є — граємо офлайн, синхронізуємось потім.
  if(lsGet('rpg_state_'+s.userId,null)){
    await loadStateFor(me.userId,false);
    enterGame();
    showToast('Офлайн — прогрес зберігається на пристрої');
    return;
  }
  me=null;showLogin();
  loginErr("Немає зв'язку з сервером");
}

async function submitClaim(){
  const nick=_v('cl-nick'),pass=_v('cl-pass'),inv=_v('cl-inv');
  const errEl=document.getElementById('cl-err');
  const btn=document.getElementById('cl-submit');
  function fail(m){if(errEl){errEl.textContent=m;errEl.style.display='block';}if(btn){btn.disabled=false;btn.textContent='Підтвердити';}}
  const bad=badNickC(nick)||badPassC(pass);
  if(bad){fail(bad);return;}
  if(!inv){fail('Потрібен код запрошення');return;}
  if(btn){btn.disabled=true;btn.textContent='Переносимо…';}
  const r=await _api({action:'register',nick:nick,password:pass,invite:inv});
  if(!r||!r.ok){
    fail(r&&r.error==='network'?"Немає зв'язку з сервером":(r&&r.error)||'Не вдалося');
    return;
  }
  // Переносимо стан з гостьового id на новий серверний.
  const oldId=me.userId,oldNick=me.nick;
  const data=state.players[oldId]||{};
  state.players[r.userId]=data;
  me={userId:r.userId,nick:r.nick,role:r.role||'reader',token:r.token,guest:false};
  lsSet(LS_SESSION,me);
  cur=r.userId;
  setPlayers(cur,me.nick);
  await saveToCloud(cur);
  localStorage.removeItem(guestKey(oldNick));
  localStorage.removeItem('rpg_state_'+oldId);
  delete state.players[oldId];
  const idx=lsGet(LS_GUESTS,[]).filter(x=>x!==oldId);
  lsSet(LS_GUESTS,idx);
  closeModal();
  renderGuestBar();
  renderMain();
  showToast('Готово! Тепер прогрес зберігається в хмарі');
}


// ═══════════ FRIENDS ═══════════
// Дані друга приходять з ЧУЖОГО клієнта (він сам формує свій стовпчик public),
// тому все, що з них рендериться, обов'язково екранується. Це єдине місце в
// грі, де екранування робиться при рендері, а не на вході: своїм даним ми
// довіряємо (їх чистить cleanBookText), чужим — ні.
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escUrl(u){
  u=String(u||'');
  return /^https:\/\/[^\s"'<>()\\]+$/i.test(u)?u:'';
}

let friendsData={friends:[],incoming:[],outgoing:[],reax:[]};
// Дані друга приходять з ЧУЖОГО клієнта — довіряти їм не можна. esc() рятує
// текст у тілі HTML, але НЕ рятує рядок усередині onclick="fn('…')": браузер
// декодує &#39; ДО того, як JS побачить код, тому апостроф із чужого поля
// закриває виклик і далі йде його код. Тому ключі, які потім підставляються
// в onclick або в індекс масиву, фільтруємо одразу на вході — одне місце на
// всі майбутні поля, а не оберігання при кожному рендері.
function sanitizeFriends(list){
  return(Array.isArray(list)?list:[]).filter(f=>f&&typeof f==='object').map(f=>{
    // id квесту йде в onclick="acceptQuest('…')" — лише те, що ми самі генеруємо.
    if(Array.isArray(f.q))f.q=f.q.filter(x=>x&&typeof x==='object'&&
      /^[A-Za-z0-9]{1,32}$/.test(String(x.id||''))&&GENRES.indexOf(String(x.g))>=0).slice(0,20);
    else delete f.q;
    // Локація йде в ключ мапи (розстановка фішок) і в пошук по LOCS. Лишаємо
    // тільки той id, який у нас справді є: чужого рядка на цьому місці бути
    // не повинно взагалі.
    if(f.loc!==undefined&&!_anyLoc(f.loc))delete f.loc;
    // рік іде в onclick="setFriendWrapYear(…)", місяць — в індекс масиву назв.
    if(f.wraps&&typeof f.wraps==='object'&&!Array.isArray(f.wraps)){
      const w={};
      Object.keys(f.wraps).forEach(k=>{
        const v=f.wraps[k];
        if(!/^[0-9]{4}$/.test(k)||!v||typeof v!=='object')return;
        const bm=v.bestMonth;
        if(bm&&!(+bm.idx>=0&&+bm.idx<=11))delete v.bestMonth;
        w[k]=v;
      });
      f.wraps=w;
    }else delete f.wraps;
    return f;
  });
}

let _frWrapYear={};   // userId → обраний рік у його підсумку
// Текст під полем додавання мусить пережити перемальовування списку: інакше
// відповідь «Запит надіслано» зникає в ту саму мить, коли з'являється.
let _frMsg={text:'',bad:false};

// Вузький зліпок для друзів. Кладеться в стовпчик public разом зі
// збереженням; повний сейв друзям не віддається ніколи.
function buildPublicSummary(d){
  const p=pl();
  const books=d.books||[];
  const last=books.length?books[books.length-1]:null;
  const wraps={};
  const thisYear=new Date().getFullYear();
  // Тільки поточний і минулий рік — щоб стовпчик не розростався.
  [String(thisYear),String(thisYear-1)].forEach(y=>{
    const w=computeYearWrap(books,y);
    if(w)wraps[y]=slimWrap(w);
  });
  const mKey=curMonthKey();
  const goal=(d.monthlyGoal&&d.monthlyGoal.periodKey===mKey)
    ?{target:d.monthlyGoal.target,done:booksInMonth(d,mKey)}:null;
  return{
    av:d.avatarUrl||null,
    clr:(d.customColor||(p&&p.color)||'#22c55e'),
    em:(p&&p.emoji)||'📖',
    loc:d.location,region:d.region||'kanto',
    caught:Object.keys(d.progress||{}).length,
    mega:countMega(d),
    books:d.booksRead||0,
    goal:goal,
    streak:d.currentGoalStreak||0,
    ach:achievementsTotals(d).unlocked,
    last:last?{title:last.title,author:last.author,cover:last.coverUrl||null,
               rating:last.rating||null}:null,
    wraps:wraps,
    q:qPublic(d),          // свій бік спільних квестів — другий бік читає це
    ts:Date.now(),
  };
}
function slimWrap(w){
  const b=x=>x?{title:x.title,pages:x.pages||0,rating:x.rating||null,cover:x.coverUrl||null}:null;
  return{
    count:w.count,pages:w.pages,avgPages:w.avgPages,avgRating:w.avgRating,
    shortest:b(w.shortestBook),longest:b(w.longestBook),top:b(w.topRatedBook),
    favLang:w.favLang?{name:w.favLang.name||w.favLang.label||'',count:w.favLang.count||0}:null,
    favGenre:w.favGenre?{name:w.favGenre.name||w.favGenre.label||'',count:w.favGenre.count||0}:null,
    favAuthor:w.favAuthor?{name:w.favAuthor.name,count:w.favAuthor.count}:null,
    bestMonth:w.bestMonth||null,
  };
}
function countMega(d){
  let n=0;
  Object.entries(d.progress||{}).forEach(([cid,st])=>{
    const ch=CHAINS.find(c=>c.id===cid);
    if(ch&&ch.stages[st-1]&&ch.stages[st-1].mega)n++;
  });
  return n;
}

// Викласти свій публічний зліпок, не перезаписуючи блоб сейву.
async function pushPublic(){
  if(!me||me.guest||!me.token||!cur)return;
  try{
    await _api({action:'pubSet',userId:me.userId,token:me.token,
                pub:JSON.stringify(buildPublicSummary(state.players[cur]))});
  }catch(e){console.warn('[pub] не вдалося оновити зліпок',e);}
}

// Стан завантаження тримаємо явно, бо раніше і «ще вантажиться», і «не
// вдалося», і «друзів справді немає» виглядали для користувача однаково —
// як порожній список.
let _frState='idle';     // idle | loading | ok | error
let _frErr='';
let _frPromise=null;

async function loadFriends(silent){
  if(!me||me.guest||!me.token)return;
  // Якщо запит уже в дорозі — приєднуємось до нього, а не виходимо мовчки.
  // Саме через «вийти мовчки» таб лишався порожнім, коли його відкривали
  // одночасно з фоновим завантаженням при вході в гру.
  if(_frPromise)return _frPromise;
  _frState='loading';_frErr='';
  if(!silent&&_mainTab==='friends')renderFriendsTab();
  _frPromise=(async()=>{
    const r=await _api({action:'friendList',userId:me.userId,token:me.token});
    if(r&&r.ok){
      friendsData={friends:sanitizeFriends(r.friends),incoming:r.incoming||[],
                   outgoing:r.outgoing||[],reax:r.reax||[]};
      _frState='ok';
      syncFriendPins();
      questsTick();
      questsSettle();
      updateFriendBadge();
      renderMap();
      // Таб закритий — про нові реакції інакше ніхто не дізнається, крім
      // крапки на кнопці. Плашка і є те «серденько при заході».
      if(_mainTab!=='friends')showReaxToast();
    }else{
      _frState='error';
      _frErr=(r&&r.error==='auth')?'Сесія закінчилась — увійди знову'
            :(r&&r.error==='network')?"Немає зв'язку з сервером"
            :((r&&r.error)||'Не вдалося завантажити список');
    }
    _frPromise=null;
    // Перемальовуємо ЗАВЖДИ, якщо таб відкритий — незалежно від того, тихим
    // був запит чи ні. Раніше тихий запит приносив дані й нічого не показував.
    if(_mainTab==='friends'){renderFriendsTab();markReaxSeen();}
  })();
  return _frPromise;
}

// Друзі як полегшені записи в PLAYERS — цикл малювання пінсів на мапі
// вже вміє з ними працювати, окремого коду для карти не потрібно.
function syncFriendPins(){
  if(!me)return;
  PLAYERS=PLAYERS.filter(p=>p.id===me.userId);
  friendsData.friends.forEach(f=>{
    if(!f.loc)return;
    PLAYERS.push({id:f.userId,name:f.nick,emoji:f.em||'📖',color:f.clr||'#22c55e',border:f.clr||'#22c55e',friend:true});
    state.players[f.userId]=Object.assign({},state.players[f.userId],{
      location:f.loc,region:f.region||'kanto',
      customColor:f.clr||'#22c55e',avatarUrl:f.av||null,customName:f.nick,
      progress:{},books:[],
    });
  });
}

// Одна крапка на всі новини таба — і запити на дружбу, і нові реакції.
// Саме одна: два бейджі на одній кнопці неминуче наїхали б один на одного.
function updateFriendBadge(){
  const el=document.getElementById('fr-badge');
  if(!el)return;
  const n=(friendsData.incoming||[]).length+reaxFresh().length+qIncoming().length;
  el.textContent=n>9?'9+':String(n);
  el.style.display=n>0?'':'none';

function renderFriendsTab(){
  const el=document.getElementById('friends-body');
  if(!el)return;
  if(me&&me.guest){
    el.innerHTML=`<div class="fr-empty">Друзі доступні читачам.<br>Гість існує лише на цьому пристрої, тому його ніхто не може додати.</div>
      <button class="fr-btn" style="width:100%;padding:11px" onclick="openClaim()">🔑 У мене є код запрошення</button>`;
    return;
  }
  const add=`<div style="display:flex;gap:6px;margin-bottom:4px">
      <input type="text" id="fr-nick" class="finput" placeholder="нікнейм друга" maxlength="20" style="margin-bottom:0"
        onkeydown="if(event.key==='Enter')sendFriendRequest()">
      <button class="fr-btn" id="fr-add-btn" style="padding:9px 14px" onclick="sendFriendRequest()">Додати</button>
    </div>
    <div id="fr-msg" style="font-size:10.5px;color:${_frMsg.bad?'var(--bad-2)':'var(--ok)'};min-height:14px;margin-bottom:4px">${esc(_frMsg.text)}</div>`;

  const inc=(friendsData.incoming||[]).map(r=>`<div class="fr-card">
      <div class="fr-av" style="background:rgba(var(--ink),.08)">👋</div>
      <div class="fr-main"><div class="fr-nick">${esc(r.nick)}</div>
        <div class="fr-loc">хоче додати тебе в друзі</div></div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <button class="fr-btn ok" onclick="acceptFriend('${esc(r.userId)}')">Прийняти</button>
        <button class="fr-btn danger" onclick="declineFriend('${esc(r.userId)}')">Відхилити</button>
      </div>
    </div>`).join('');

  const out=(friendsData.outgoing||[]).map(r=>`<div class="fr-card">
      <div class="fr-av" style="background:rgba(var(--ink),.05)">⏳</div>
      <div class="fr-main"><div class="fr-nick">${esc(r.nick)}</div>
        <div class="fr-loc">запит надіслано, чекаємо підтвердження</div></div>
    </div>`).join('');

  const list=(friendsData.friends||[]).map(f=>friendCardHTML(f)).join('');
  const rx=reaxBlockHTML();
  const qs=questsBlockHTML();
  const qb=questsBoardHTML();

  // Порожній список, помилка мережі й «ще вантажиться» — три різні речі,
  // і виглядати вони мусять по-різному.
  const nothing=!inc&&!out&&!list&&!rx&&!qs&&!qb;
  let middle;
  if(_frState==='loading'&&nothing)
    middle=`<div class="fr-empty">Завантаження…</div>`;
  else if(_frState==='error'&&nothing)
    middle=`<div class="fr-empty" style="color:var(--bad-2)">${esc(_frErr)}</div>
      <button class="fr-btn" style="width:100%;padding:11px" onclick="loadFriends()">Спробувати ще раз</button>`;
  else if(nothing)
    middle=`<div class="fr-empty">Друзів поки немає.<br>Впиши нікнейм — друг побачить запит і зможе його підтвердити.</div>`;
  else
    // Реакції — найприємніша новина, тому першими.
    middle=rx+qs
          +(inc?`<div class="fr-sub">Запити до тебе</div>${inc}`:'')
          +list
          +(out?`<div class="fr-sub">Надіслані запити</div>${out}`:'')
          +qb;

  const refresh=`<div style="display:flex;justify-content:space-between;gap:6px;margin-bottom:6px">
      <button class="fr-btn" onclick="openQuestCreate()">🤝 Спільний квест</button>
      <button class="fr-btn" onclick="loadFriends()" ${_frState==='loading'?'disabled':''}>
        ${_frState==='loading'?'Оновлюю…':'↻ Оновити'}</button>
    </div>`;
  const errLine=(_frState==='error'&&!nothing)
    ?`<div class="fr-empty" style="color:var(--bad-2);padding:6px 0">${esc(_frErr)}</div>`:'';

  el.innerHTML=add+refresh+errLine+middle;
}

// Грубо, а не з точністю до хвилини: «сьогодні / вчора / 3 дні тому» читається
// краще й менше схоже на слідкування, ніж «був 14:32».
function agoLabel(ts){
  ts=+ts||0;
  if(!ts)return'';
  const days=Math.floor((Date.now()-ts)/86400000);
  if(days<=0)return'сьогодні';
  if(days===1)return'вчора';
  if(days<7)return days+' '+pluralUA(days,'день','дні','днів')+' тому';
  if(days<14)return'тиждень тому';
  if(days<31){const w=Math.floor(days/7);return w+' '+pluralUA(w,'тиждень','тижні','тижнів')+' тому';}
  if(days<365){const m=Math.floor(days/30);return m+' '+pluralUA(m,'місяць','місяці','місяців')+' тому';}
  return'давно';
}

// ═══════════ РЕАКЦІЇ ❤️ НА КНИГИ ═══════════
// Друг тапає серденько на книзі у твоїй картці — тобі в таб «Друзі» приходить
// крапка, а в самому табі видно книгу й хто саме відреагував.
// Реакція живе в рядку ОТРИМУВАЧА на сервері (див. doReact в apps_script.gs)
// і приїжджає тим самим friendList, окремого запиту немає.
//
// Ключ книги — назва+автор у нормалізованому вигляді: у книжок у сейві немає
// id, а друг узагалі бачить лише зліпок (`last`), тому впізнати книгу можна
// тільки так. Побічний бонус: ключ дає зіставити реакцію зі своєю книгою і
// показати її обкладинку та серденька в картці книги.
const RX_KEY_MAX=120;
const RX_MINE_MAX=200;   // скільки своїх реакцій тримаємо в сейві
function reaxKey(title,author){
  const n=s=>String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();
  return (n(title)+'|'+n(author)).slice(0,RX_KEY_MAX);
}
// Свої поставлені реакції лежать у сейві, а не в localStorage: серденько
// мусить лишатись натиснутим і коли зайдеш з іншого пристрою.
function myReax(){const d=pd();if(!d)return{};if(!d.myReax)d.myReax={};return d.myReax;}
function iReacted(fid,key){return !!myReax()[fid+'|'+key];}

async function toggleBookReaction(btn){
  if(!btn||btn.disabled)return;
  const fid=btn.dataset.fid,key=btn.dataset.key,title=btn.dataset.title||'';
  if(!fid||!key)return;
  if(!me||me.guest||!me.token){showToast('Реакції доступні читачам');return;}
  const was=iReacted(fid,key);
  btn.disabled=true;
  const r=await _api({action:'react',userId:me.userId,token:me.token,
                      other:fid,key:key,title:title,off:was?1:0});
  btn.disabled=false;
  if(!r||!r.ok){
    // Якщо index.html залили раніше, ніж розгорнули новий apps_script.gs,
    // сервер відповість «Unknown action» — кажемо це по-людськи, а не кодом.
    const err=String((r&&r.error)||'');
    showToast(err==='network'?"Немає зв'язку з сервером"
             :err==='auth'?'Сесія закінчилась — увійди знову'
             :/Unknown action/.test(err)?'Реакції ще не ввімкнені на сервері'
             :(err||'Не вдалося поставити реакцію'));
    return;
  }
  const mine=myReax();
  if(was)delete mine[fid+'|'+key];
  else{
    mine[fid+'|'+key]=Date.now();
    // Свій список не даємо розпухати: сейв живе в одній клітинці таблиці.
    const keys=Object.keys(mine);
    if(keys.length>RX_MINE_MAX)
      keys.sort((a,b)=>mine[a]-mine[b]).slice(0,keys.length-RX_MINE_MAX)
          .forEach(k=>delete mine[k]);
  }
  setReaxBtn(btn,!was);
  saveToCloud(cur);
  showToast(was?'Реакцію знято':'❤️ Друг побачить твоє серденько');
}
// U+FE0E після глифа — щоб система показала саме символ, а не підмінила його
// емодзі: підмінене емодзі має власний колір і токен теми на нього не діє.
const RX_ON='♥︎',RX_OFF='♡︎';
function setReaxBtn(btn,on){
  btn.classList.toggle('on',on);
  btn.textContent=on?RX_ON:RX_OFF;
  btn.title=on?'Прибрати реакцію':'Сподобалась книга друга';
}
// Серденько в картці друга — біля його останньої книги.
function reaxBtnHTML(f){
  if(!f||!f.last||!f.last.title)return'';
  if(!me||me.guest)return'';
  const key=reaxKey(f.last.title,f.last.author);
  const on=iReacted(f.userId,key);
  // Назва книги приходить з чужого клієнта і може містити апостроф («Ім'я
  // вітру»), тому вона їде в data-атрибутах, а не в тексті onclick: у другому
  // випадку апостроф розірвав би JS-рядок.
  return`<button class="rx-btn${on?' on':''}" onclick="toggleBookReaction(this)"
    title="${on?'Прибрати реакцію':'Сподобалась книга друга'}"
    aria-label="${on?'Прибрати реакцію':'Сподобалась книга друга'}"
    data-fid="${esc(f.userId)}" data-key="${esc(key)}" data-title="${esc(f.last.title)}"
    >${on?RX_ON:RX_OFF}</button>`;
}

// Групуємо по книзі: три друзі на одну книгу — це один рядок із трьома
// чіпами. Реакція другого друга не затирає першу ні в даних (на сервері запис
// ідентифікується парою «хто + яка книга»), ні на екрані.
function reaxGroups(){
  // Ключ реакції пише ТОЙ, ХТО РЕАГУЄ, і бекенд кладе його в наш рядок як є
  // (лише обрізає до 120 символів). Тому мапа без прототипу — інакше
  // key:'__proto__' клав увесь таб друзів, і запис при цьому лежав би на
  // сервері, тобто ламав його заново після кожного перезавантаження.
  const by=Object.create(null);
  (friendsData.reax||[]).forEach(r=>{
    if(!r||!r.k)return;
    const k=String(r.k),ts=+r.ts||0;
    const g=by[k]||(by[k]={key:k,title:String(r.t||''),ts:0,who:[]});
    if(!g.title&&r.t)g.title=String(r.t);
    if(ts>g.ts)g.ts=ts;
    if(!g.who.some(w=>w.f===String(r.f)))g.who.push({f:String(r.f),n:String(r.n||''),ts:ts});
  });
  return Object.keys(by).map(k=>by[k]).sort((a,b)=>b.ts-a.ts);
}
function reaxFresh(){
  const seen=+((pd()||{}).reaxSeen||0);
  return (friendsData.reax||[]).filter(r=>r&&(+r.ts||0)>seen);
}
// Позначку «нове» рахуємо від зліпка на момент відкриття таба, а не від
// поточного reaxSeen: інакше вона зникала б у ту саму мить, коли ти зайшов.
let _rxSeenSnap=0;
function markReaxSeen(){
  const d=pd();if(!d)return;
  const max=(friendsData.reax||[]).reduce((m,r)=>Math.max(m,+((r&&r.ts)||0)),0);
  if(max>(+d.reaxSeen||0)){d.reaxSeen=max;saveToCloud(cur);}
  updateFriendBadge();
}
function bookByReaxKey(key){
  const d=pd();if(!d)return null;
  return (d.books||[]).find(b=>reaxKey(b.title,b.author)===key)||null;
}
// Нік беремо зі свіжого списку друзів (нік могли змінити), а збережений у
// реакції — як запас, якщо друга в списку вже немає.
function reaxChipHTML(w){
  const f=(friendsData.friends||[]).find(x=>String(x.userId)===w.f);
  const nick=(f&&f.nick)||w.n||'друг';
  const clr=(f&&esc(f.clr))||'#22c55e';
  const av=(f&&escUrl(f.av))
    ?`<span class="rx-chip-av"><img src="${escUrl(f.av)}" onerror="this.style.display='none'"></span>`
    :`<span class="rx-chip-av" style="background:${clr}">${esc((f&&f.em)||'📖')}</span>`;
  return`<span class="rx-chip">${av}<span class="rx-chip-n">${esc(nick)}</span></span>`;
}
function reaxBlockHTML(){
  // Реакція — швидка активність, а не список, який живе вічно. Показуємо
  // ЛИШЕ те, що з'явилось після минулого заходу в таб: подивилась — і
  // плашка зникла сама. Раніше тут висіли всі реакції взагалі, і зникав
  // лише значок «нове», тому в дитини напис не йшов і після перезаходу.
  const groups=reaxGroups().filter(g=>g.ts>_rxSeenSnap);
  if(!groups.length)return'';
  const rows=groups.map(g=>{
    const book=bookByReaxKey(g.key);
    const cover=(book&&escUrl(book.coverUrl))
      ?`<img class="rx-cover" src="${escUrl(book.coverUrl)}" loading="lazy" onerror="this.style.display='none'">`:'';
    return`<div class="rx-card">
      ${cover}
      <div class="rx-main">
        <div class="rx-title">❤️ «${esc(g.title||(book&&book.title)||'книга')}»</div>
        <div class="rx-who">${g.who.map(reaxChipHTML).join('')}</div>
      </div>
    </div>`;
  }).join('');
  return`<div class="fr-sub">❤️ Твої книги сподобались</div>${rows}`;
}
// Показуємо, коли таб закритий: у самому табі про це й так написано.
function showReaxToast(){
  const fresh=reaxFresh();
  if(!fresh.length)return;
  const names=[];
  fresh.forEach(r=>{
    const f=(friendsData.friends||[]).find(x=>String(x.userId)===String(r.f));
    const nick=(f&&f.nick)||r.n||'друг';
    if(names.indexOf(nick)<0)names.push(nick);
  });
  const who=names.slice(0,2).join(', ')+(names.length>2?' +'+(names.length-2):'');
  const n=fresh.length;
  showLocToast('❤️ '+esc(who),
    n===1?'сподобалась твоя книга'
         :n+' '+pluralUA(n,'реакція','реакції','реакцій')+' на твої книги');
}

// ═══════════ СПІЛЬНІ КВЕСТИ ═══════════
// «Давай цього місяця прочитаємо щось із детективів» — по одній книзі з
// кожного. Одиниця тут не кількість, а ЖАНР, тому з місячною ціллю не
// конфліктує: квест міняє ЩО читаєш, а не СКІЛЬКИ.
//
// ГОЛОВНИЙ ПРИНЦИП: нуль кнопок. Дочитав книгу → додав у бібліотеку →
// вказав жанр. Якщо жанр збігся з квестом і книга додана після його початку,
// вона зараховується САМА. Коли зарахувалось у обох, квест сам переїжджає
// на дошку пройдених — нічого не «забирати».
// Працює на совість (у детективи можна занести й «Колобка») — і це свідомо:
// перевіряти нічого, бо це сім'я, а не змагання.
//
// Де що лежить:
//   d.quests      — живі: {id,with,withNick,g,ts0,tsUp,st}
//                   st: inv (запросив) | act (йде) | dec (відмовив) | done
//   d.questsDone   — дошка пройдених, з обкладинками ОБОХ книг
//   d.questDecl    — відмови: «друг|жанр», щоб не пропонувати те саме
//   book.q         — позначка 🤝 на книзі
//
// Спільного запису на сервері НЕМА: кожен публікує свій бік у власному
// стовпці `public` (поле q), другий читає його тим самим friendList. Час
// старту призначає ТОЙ, ХТО ПРИЙНЯВ — інакше двоє розійшлись би в тому, коли
// квест почався.
const Q_DAYS=30;                       // активний квест живе 30 днів
const Q_MS=Q_DAYS*86400000;
const Q_INV_MS=7*86400000;             // запрошення без відповіді — 7 днів
const Q_SEEN_MS=2*86400000;
const Q_DECL_MS=60*86400000;           // «вже відмовився» — підказка, не заборона
const Q_DEC_MS=86400000;               // «друг відхилив» — показуємо добу
const Q_DECID_MS=8*86400000;           // пам'ять про відхилене запрошення
const Q_BOARD_MAX=60;                  // дошка: скільки квестів пам'ятаємо
const Q_PUB_MAX=12;                    // скільки квестів їде другові у зліпку            // dec/done — доки другий бік побачить
function qList(){const d=pd();if(!d)return[];if(!d.quests)d.quests=[];return d.quests;}
function qDone(){const d=pd();if(!d)return[];if(!d.questsDone)d.questsDone=[];return d.questsDone;}
function qDecl(){const d=pd();if(!d)return{};if(!d.questDecl)d.questDecl={};return d.questDecl;}
// Відхилені ЗАПРОШЕННЯ — по id, а не по жанру. Раніше пам'ять була
// «друг+жанр», і через неї друг більше не міг прислати той самий жанр
// удруге: запрошення мовчки не доходило. Тепер пам'ять лише про те
// конкретне запрошення, яке вже відхилили, щоб воно не поверталось.
function qDeclIds(){const d=pd();if(!d)return{};if(!d.questDeclIds)d.questDeclIds={};return d.questDeclIds;}
// Нік у записі — знімок на момент створення. Людина могла перейменуватись,
// тому показуємо ЖИВИЙ нік зі списку друзів, а збережений лишається запасом.
function qNick(q){
  if(!q)return'друг';
  const id=String(q.with||q.from||'');
  const f=(friendsData.friends||[]).find(x=>String(x.userId)===id);
  return (f&&f.nick)||q.withNick||q.fromNick||'друг';
}
function qNewId(){return 'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function qDaysLeft(q){return Math.max(0,Math.ceil((q.ts0+Q_MS-Date.now())/86400000));}
function qActive(){return qList().filter(q=>q.st==='act');}

// ── автозарахування ──
// Книга підходить квесту, якщо жанр той самий і додана після старту.
// Одна книга йде максимум в один квест: розподіляємо по порядку старту
// квестів, інакше при двох квестах на той самий жанр одна книга закрила б
// обидва. Нічого не зберігаємо — рахуємо щоразу, тому «зарахувати» й
// «не та книга» стають непотрібні.
function qMatchAll(d){
  d=d||pd();
  if(!d)return{};
  const used={};
  (d.questsDone||[]).forEach(x=>{if(x.my&&x.my.k)used[x.my.k]=1;});
  const out={};
  (d.quests||[]).filter(q=>q.st==='act').slice()
    .sort((a,b)=>(+a.ts0||0)-(+b.ts0||0)).forEach(q=>{
      const hit=(d.books||[]).map((b,i)=>({b,i}))
        .filter(({b})=>b&&b.genre===q.g&&bookTime(b)>q.ts0&&!used[reaxKey(b.title,b.author)])
        .sort((x,y)=>bookTime(x.b)-bookTime(y.b))[0];
      if(hit){used[reaxKey(hit.b.title,hit.b.author)]=1;out[q.id]=hit.i;}
    });
  return out;
}
// Те, що бачить друг. Разом з галочкою їде й книга — щоб на дошці пройдених
// стояли обкладинки обох, а не лише своя.
function qPublic(d){
  const m=qMatchAll(d);
  // У стовпчик public влазить 8000 символів на ВСЕ, а тут на кожен квест ще
  // назва й посилання на обкладинку. Тому спершу живі квести, далі —
  // найсвіжіші службові записи, і не більше Q_PUB_MAX.
  const rank=q=>(q.st==='act'||q.st==='inv')?0:1;
  return(d.quests||[]).slice()
    .sort((a,b)=>rank(a)-rank(b)||(+b.tsUp||0)-(+a.tsUp||0))
    .slice(0,Q_PUB_MAX)
    .map(q=>{
    const rec={id:q.id,w:q.with,g:q.g,ts0:q.ts0||0,st:q.st,m:m[q.id]!==undefined?1:0};
    const b=m[q.id]!==undefined?(d.books||[])[m[q.id]]:null;
    if(b)rec.b={t:String(b.title||'').slice(0,80),c:b.coverUrl||null};
    return rec;
  });
}
function qTheirs(q){
  const f=(friendsData.friends||[]).find(x=>String(x.userId)===String(q.with));
  if(!f||!Array.isArray(f.q))return null;
  return f.q.find(x=>x&&x.id===q.id&&String(x.w)===String(me&&me.userId))||null;
}
function qTheirOk(t){return!!(t&&(t.m||t.st==='done'));}
function qIncoming(){
  if(!me)return[];
  const mine=qList();
  const declIds=qDeclIds();
  const out=[];
  (friendsData.friends||[]).forEach(f=>{
    if(!Array.isArray(f.q))return;
    f.q.forEach(x=>{
      if(!x||x.st!=='inv'||String(x.w)!==String(me.userId))return;
      if(mine.some(q=>q.id===x.id))return;
      // Пропускаємо ЛИШЕ те саме запрошення, яке вже відхилили (інакше воно
      // поверталось би, коли службовий запис згорить). Той самий жанр друг
      // може прислати заново — це нове запрошення з новим id.
      if(declIds[x.id])return;
      out.push({id:x.id,from:String(f.userId),fromNick:f.nick,g:String(x.g||'')});
    });
  });
  return out;
}

// ── прибирання й закриття ──
// Строк має кожен стан, не лише активний: інакше запрошення висіло б вічно.
function questsTick(){
  const d=pd();if(!d)return false;
  const before=JSON.stringify(d.quests||[]);
  d.quests=(d.quests||[]).filter(q=>{
    if(!q||!q.id||!q.with)return false;
    const friend=(friendsData.friends||[]).some(x=>String(x.userId)===String(q.with));
    if(_frState==='ok'&&!friend)return false;
    // Нік міг змінитись — підтягуємо в запис, щоб не показувати старий.
    const fr=(friendsData.friends||[]).find(x=>String(x.userId)===String(q.with));
    if(fr&&fr.nick&&q.withNick!==fr.nick)q.withNick=fr.nick;
    const age=Date.now()-(+q.tsUp||+q.ts0||0);
    if(q.st==='act'&&q.ts0&&Date.now()-q.ts0>Q_MS)return false;
    if(q.st==='inv'&&age>Q_INV_MS)return false;
    if(q.st==='dec'&&age>Q_DEC_MS)return false;      // сповіщення живе добу
    if(q.st==='done'&&age>Q_SEEN_MS)return false;
    const t=qTheirs(q);
    // Друг скасував квест або його запис уже згорів — тримати сповіщення
    // «він відхилив» нема сенсу, воно вже ні про що.
    if(q.st==='dec'&&q.by!=='me'&&_frState==='ok'&&!t)return false;
    // Друг відмовився. НЕ видаляємо тихо: інакше запрошення просто зникає,
    // і людина не розуміє, що сталось (і чому жанр більше не пропонується).
    // Помічаємо своє й лишаємо на Q_SEEN_MS — далі воно згорить саме.
    if(t&&t.st==='dec'){
      if(q.st!=='dec'){q.st='dec';q.tsUp=Date.now();}
      return true;
    }
    if(q.st==='inv'&&t&&t.st==='act'){q.st='act';q.ts0=+t.ts0||Date.now();q.tsUp=Date.now();}
    return true;
  });
  // Те саме для дошки пройдених: там нік теж лежить знімком.
  (d.questsDone||[]).forEach(r=>{
    const f=(friendsData.friends||[]).find(x=>String(x.userId)===String(r.with));
    if(f&&f.nick&&r.withNick!==f.nick)r.withNick=f.nick;
  });
  const changed=JSON.stringify(d.quests)!==before;
  if(changed)saveToCloud(cur);
  return changed;
}
// Обидва зарахували → квест сам переїжджає на дошку. Запис лишається зі
// станом 'done' ще два дні: інакше друг, який не встиг закрити свій бік,
// перестав би бачити мою галочку.
function questsSettle(silent){
  const d=pd();if(!d)return[];
  const m=qMatchAll(d);
  const fresh=[];
  (d.quests||[]).forEach(q=>{
    if(q.st!=='act')return;
    const idx=m[q.id];
    if(idx===undefined)return;
    const t=qTheirs(q);
    if(!qTheirOk(t))return;
    const b=(d.books||[])[idx];
    const rec={id:q.id,with:q.with,withNick:q.withNick,g:q.g,ts0:q.ts0,endedAt:Date.now(),
      my:{t:b.title,k:reaxKey(b.title,b.author)},
      their:(t&&t.b)?{t:t.b.t,c:t.b.c||null}:null};
    (d.questsDone=d.questsDone||[]).push(rec);
    if(d.questsDone.length>Q_BOARD_MAX)d.questsDone=d.questsDone.slice(-Q_BOARD_MAX);
    if(b)b.q={n:q.withNick,g:q.g};
    q.st='done';q.tsUp=Date.now();
    fresh.push(rec);
  });
  if(fresh.length){
    const beforeAch=fullyCompletedKeys(d);
    saveToCloud(cur);
    renderLibraryTab();renderAchievementsWidget();
    if(!silent){
      const r=fresh[0];
      mHTML(`${M_CLOSE_BTN}<div class="m-emoji">🤝</div>
        <div class="m-title">Квест пройдено!</div>
        <div class="m-desc" style="margin-bottom:14px">Ти і ${esc(qNick(r))} прочитали «${esc(r.g)}».
          Обидві книги — на дошці пройдених квестів.</div>
        ${qPairHTML(r)}
        <button class="btn-ok" style="width:100%;margin-top:14px;padding:12px" onclick="closeModal()">Клас</button>`);
    }
    celebrateNewAchievements(d,beforeAch);
  }
  return fresh;
}

// ── створення й відповіді ──
function openQuestCreate(fid,skipGenre){
  const friends=(friendsData.friends||[]).filter(f=>!qList().some(q=>
    String(q.with)===String(f.userId)&&(q.st==='inv'||q.st==='act')));
  if(!friends.length){showToast('З усіма друзями квест уже є');return;}
  const sel=friends.some(f=>String(f.userId)===String(fid))?String(fid):String(friends[0].userId);
  const decl=qDecl();
  // Раніше жанр після відмови ЗНИКАВ зі списку — назавжди й без пояснень,
  // тому запропонувати те саме вдруге було неможливо. Тепер це підказка:
  // жанр на місці, просто помічений.
  const genres=GENRES.filter(g=>g!==skipGenre);
  const declLbl=g=>{
    const was=+decl[sel+'|'+g]||0;
    return (was&&Date.now()-was<Q_DECL_MS)?' — вже відмовлявся':'';
  };
  mHTML(`${M_CLOSE_BTN}<div class="m-title">🤝 Спільний квест</div>
    <div class="m-desc" style="margin-bottom:12px">По одній книзі з кожного. ${Q_DAYS} днів.</div>
    <div class="flbl">З ким</div>
    <select id="q-friend" class="finput" onchange="openQuestCreate(this.value)">
      ${friends.map(f=>`<option value="${esc(f.userId)}" ${String(f.userId)===sel?'selected':''}>${esc(f.nick)}</option>`).join('')}
    </select>
    <div class="flbl">Жанр</div>
    <select id="q-genre" class="finput">
      ${genres.map(g=>`<option value="${esc(g)}">${esc(g)}${declLbl(g)}</option>`).join('')}
    </select>
    <button class="btn-ok" style="width:100%;padding:13px;margin-top:6px" onclick="sendQuest()">Запропонувати</button>`);
}
function sendQuest(){
  const fid=document.getElementById('q-friend')?.value;
  const g=document.getElementById('q-genre')?.value;
  if(!fid||!g){showToast('Обери друга й жанр');return;}
  if(qList().some(q=>String(q.with)===String(fid)&&(q.st==='inv'||q.st==='act'))){
    closeModal();showToast('З цим другом квест уже є');return;   // подвійний тап
  }
  const f=(friendsData.friends||[]).find(x=>String(x.userId)===String(fid));
  qList().push({id:qNewId(),with:String(fid),withNick:(f&&f.nick)||'друг',
                g:g,ts0:0,tsUp:Date.now(),st:'inv'});
  saveToCloud(cur);
  closeModal();
  renderFriendsTab();
  showToast('Запрошення надіслано');
}
function acceptQuest(id){
  const inc=qIncoming().find(x=>x.id===id);
  if(!inc)return;
  qList().push({id:inc.id,with:inc.from,withNick:inc.fromNick,g:inc.g,
                ts0:Date.now(),tsUp:Date.now(),st:'act'});
  saveToCloud(cur);
  questsSettle();                 // могла бути книга, додана вже після старту
  renderFriendsTab();
  showToast('Квест почався!');
}
function declineQuest(id,counter){
  const inc=qIncoming().find(x=>x.id===id);
  if(!inc)return;
  qDecl()[inc.from+'|'+inc.g]=Date.now();     // підказка у виборі жанру
  const ids=qDeclIds();
  ids[inc.id]=Date.now();
  Object.keys(ids).forEach(k=>{if(Date.now()-(+ids[k]||0)>Q_DECID_MS)delete ids[k];});
  qList().push({id:inc.id,with:inc.from,withNick:inc.fromNick,g:inc.g,
                ts0:0,tsUp:Date.now(),st:'dec',by:'me'});
  saveToCloud(cur);
  if(counter)openQuestCreate(inc.from,inc.g);
  else{renderFriendsTab();showToast('Відхилено');}
}
// Скасувати можна лише СВОЄ запрошення, яке ще не прийняли: домовленості
// ще немає, тому втрачати нічого. Активний квест не завершується руками —
// або зарахується сам, або згорить за 30 днів.
// Сповіщення «друг відхилив» людина може прибрати сама, не чекаючи доби.
// Це саме сповіщення: воно нічого не тримає й нікому більше не потрібне.
function dismissQuestNote(id){
  const d=pd();if(!d)return;
  d.quests=(d.quests||[]).filter(x=>!(x.id===id&&x.st==='dec'));
  saveToCloud(cur);
  renderFriendsTab();
}
function cancelInvite(id){
  const q=qList().find(x=>x.id===id&&x.st==='inv');
  if(!q)return;
  // Друг уже прийняв, просто до мене ще не дійшло. Скасовувати нічого —
  // інакше в нього лишився б квест, у якого зник другий бік.
  const t=qTheirs(q);
  if(t&&t.st==='act'){
    q.st='act';q.ts0=+t.ts0||Date.now();q.tsUp=Date.now();
    saveToCloud(cur);renderFriendsTab();
    showToast('Друг уже прийняв — квест почався');
    return;
  }
  const d=pd();
  d.quests=(d.quests||[]).filter(x=>x.id!==id);
  saveToCloud(cur);
  renderFriendsTab();
  showToast('Запрошення скасовано');
}

// ── дошка пройдених: обкладинки обох книг ──
function qCoverHTML(b,cls){
  if(!b)return`<div class="${cls} q-cover-ph">?</div>`;
  const[top,bot]=_colorFor(b.t||'');
  return escUrl(b.c)
    ?`<img class="${cls}" src="${escUrl(b.c)}" loading="lazy" alt="" title="${esc(b.t||'')}" onerror="this.style.display='none'">`
    :`<div class="${cls} q-cover-ph" title="${esc(b.t||'')}" style="background:linear-gradient(150deg,${top},${bot})">${esc(b.t||'')}</div>`;
}
// Своя обкладинка в записі не лежить: тягнемо з бібліотеки за ключем. Книгу
// видалили — лишається кольорова заглушка з назвою, запис не втрачається.
function qMyCover(r){
  if(!r||!r.my)return null;
  if(r.my.c)return r.my;
  const b=((pd()||{}).books||[]).find(x=>x&&reaxKey(x.title,x.author)===r.my.k);
  return b&&b.coverUrl?{t:r.my.t,c:b.coverUrl}:r.my;
}
function qPairHTML(r){
  return`<div class="q-pair">
    <div class="q-pair-side">${qCoverHTML(qMyCover(r),'q-cover')}<div class="q-pair-n">Ти</div></div>
    <div class="q-pair-plus">🤝</div>
    <div class="q-pair-side">${qCoverHTML(r.their,'q-cover')}<div class="q-pair-n">${esc(qNick(r))}</div></div>
  </div>`;
}
function questsBoardHTML(){
  const list=qDone().slice().sort((a,b)=>(+b.endedAt||0)-(+a.endedAt||0));
  if(!list.length)return'';
  return`<div class="fr-sub">🤝 Дошка пройдених квестів</div>`+
    list.map(r=>`<div class="q-board">
      <div class="q-board-hdr">
        <span class="q-board-g">${esc(r.g)}</span>
        <span class="q-board-d">${esc(uaDate({ts:r.endedAt}))}</span>
      </div>
      ${qPairHTML(r)}
    </div>`).join('');
}

// ── плашки в табі «Друзі» ──
function questsBlockHTML(){
  if(!me||me.guest)return'';
  const inc=qIncoming();
  // 'dec' від друга теж показуємо — але не свій власний службовий запис
  // (його ставить declineQuest, щоб інший бік дізнався про відмову).
  const mine=qList().filter(q=>q.st==='inv'||q.st==='act'||(q.st==='dec'&&q.by!=='me'));
  if(!inc.length&&!mine.length)return'';
  const m=qMatchAll();
  const cards=[];
  inc.forEach(x=>cards.push(`<div class="q-card">
    <div class="q-hdr"><span class="q-emoji">🤝</span>
      <div><div class="q-title">${esc(qNick(x))} пропонує квест</div>
        <div class="q-sub">Жанр: ${esc(x.g)} · по книзі з кожного</div></div></div>
    <div class="q-btns">
      <button class="fr-btn ok" onclick="acceptQuest('${esc(x.id)}')">Прийняти</button>
      <button class="fr-btn" onclick="declineQuest('${esc(x.id)}',1)">Інший жанр</button>
      <button class="fr-btn danger" onclick="declineQuest('${esc(x.id)}')">Відхилити</button>
    </div></div>`));
  mine.forEach(q=>{
    if(q.st==='dec'){
      cards.push(`<div class="q-card">
        <div class="q-hdr"><span class="q-emoji">🚫</span>
          <div><div class="q-title">${esc(qNick(q))} відхилив квест</div>
            <div class="q-sub">Жанр: ${esc(q.g)}</div></div></div>
        <div class="q-btns">
          <button class="fr-btn" onclick="openQuestCreate('${esc(q.with)}')">Запропонувати ще раз</button>
          <button class="fr-btn" onclick="dismissQuestNote('${esc(q.id)}')">Прибрати</button>
        </div>
      </div>`);
      return;
    }
    if(q.st==='inv'){
      const t=qTheirs(q);
      const txt=t&&t.st==='dec'?`Відмова · ${esc(qNick(q))}`:`Чекаємо · ${esc(qNick(q))}`;
      cards.push(`<div class="q-card">
        <div class="q-hdr"><span class="q-emoji">⏳</span>
          <div><div class="q-title">${txt}</div>
            <div class="q-sub">Жанр: ${esc(q.g)}</div></div></div>
        <div class="q-btns"><button class="fr-btn danger" onclick="cancelInvite('${esc(q.id)}')">Скасувати запрошення</button></div>
      </div>`);
      return;
    }
    const t=qTheirs(q);
    const meOk=m[q.id]!==undefined,themOk=qTheirOk(t);
    const days=qDaysLeft(q);
    const myBook=meOk?(pd().books||[])[m[q.id]]:null;
    cards.push(`<div class="q-card">
      <div class="q-hdr"><span class="q-emoji">🤝</span>
        <div><div class="q-title">${esc(q.g)}</div>
          <div class="q-sub">${esc(qNick(q))} · ${days} ${pluralUA(days,'день','дні','днів')} лишилось</div></div></div>

  const r=await _api({action:'friendAdd',userId:me.userId,token:me.token,nick:nick});

  if(!r||!r.ok){

// ═══════════ DEX (COLLECTION) ═══════════
function renderDex(){
  const d=pd();
  const held=CHAINS.filter(c=>d.progress[c.id]!==undefined);
  document.getElementById('dex-count').innerHTML=`🐣 ${held.length} &nbsp; 🐉 ${megasCaughtIn(d,ALL_KANTO_LOCS)}`;
  const grid=document.getElementById('dex-grid');
  const completeEl=document.getElementById('dex-complete');
  if(!held.length){grid.innerHTML='<div class="dex-empty">Ще нікого не спіймано.<br>Прочитай книгу і почни ловити!</div>';completeEl.innerHTML='';return;}
  const inProgress=held.filter(c=>d.progress[c.id]<c.stages.length-1);
  const done=held.filter(c=>d.progress[c.id]===c.stages.length-1);
  const order=d.progressOrder||[];
  const byRecency=(a,b)=>{
    const ai=order.indexOf(a.id),bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1)return 0;
    if(ai===-1)return 1;
    if(bi===-1)return -1;
    return bi-ai;
  };
  inProgress.sort(byRecency);
  done.sort(byRecency);
  grid.innerHTML=inProgress.map(chain=>{
    const idx=d.progress[chain.id];const stage=chain.stages[idx];
    const dots=chain.stages.length>1?`<div class="evo-dots">${chain.stages.map((s,i)=>`<div class="evo-dot ${i<=idx?'filled':''}"></div>`).join('')}</div>`:'';
    return`<div class="dex-card" onclick="openDexCard('${chain.id}')">
      <img class="dex-img" src="${img(stage.pid)}" loading="lazy" decoding="async"
        data-pid="${stage.pid}" data-name="${esc(stage.name)}" onerror="sprFail(this)">
      <div class="dex-name">${stage.name}</div>
      ${dots}
    </div>`;
  }).join('')||'<div class="dex-empty">Усі спіймані ланцюжки завершено!</div>';
  if(!done.length){completeEl.innerHTML='';return;}
  const chainHtml=done.map(chain=>{
    const sprites=chain.stages.map((s,i)=>(i>0?`<div class="chain-arrow">→</div>`:'')+
      `<div class="chain-sprite" onclick="event.stopPropagation();openDexCard('${chain.id}')">
        <img style="width:38px;height:38px;object-fit:contain;image-rendering:pixelated" src="${img(s.pid)}"
          loading="lazy" decoding="async" data-pid="${s.pid}" data-ph="hide" onerror="sprFail(this)">
        <div style="font-size:6.5px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44px;margin-top:1px;line-height:1.2">${s.name}</div>
      </div>`).join('');
    return`<div class="chain-block"><div class="chain-block-badge">✓</div>${sprites}</div>`;
  }).join('');
  completeEl.innerHTML=`<div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:4px 0 5px;opacity:.8">🏆 Завершені</div><div class="chain-row">${chainHtml}</div>`;
  sprWarm(_dexPids(held));
}
// Усі pid, які взагалі зустрінуться в колекції — і поточні стадії, і всі
// стадії завершених ланцюжків.
function _dexPids(held){
  const out=[];
  (held||[]).forEach(c=>c.stages.forEach(s=>out.push(s.pid)));

}

// ═══════════ MAP ═══════════
// Фішки гравців малюються однаково в обох регіонах — різняться лише радіус
// вузла, розмір фішки й набір локацій. Раніше цей блок стояв двічі копією.
function _mapMarkersHTML(locs,region,up,dotR,strokeW){
  // Object.create(null), а не {}: ключем тут є location друга, тобто рядок із
  // чужого клієнта. У звичайного об'єкта byLoc['__proto__'] віддав би
  // Object.prototype (він же «істинний»), .push у нього немає — і весь
  // renderMap падав, забираючи з собою і збереження в doMove, і таб друзів.
  const byLoc=Object.create(null);
  PLAYERS.forEach(p=>{
    const sp=state.players[p.id];if(!sp)return;
    if((sp.region||'kanto')!==region)return;
    (byLoc[sp.location]||(byLoc[sp.location]=[])).push(p);
  });
  let mh='';
  Object.entries(byLoc).forEach(([lid,list])=>{
    const loc=locs[lid];if(!loc)return;
    list.forEach((p,i)=>{
      const dx=(i-(list.length-1)/2)*16;
      mh+=`<circle cx="${loc.cx+dx}" cy="${loc.cy-up}" r="${dotR}" fill="${pClr(p,state.players[p.id])}" stroke="#fff" stroke-width="${strokeW}"${p.friend?` style="cursor:pointer" onclick="openFriendCard('${p.id}')"`:``}/>`;
    });
  });
  return mh;
}
function renderMap(){
  const d=pd();
  const region=d.region||'kanto';

// ═══════════ ACTIONS / CATCH ═══════════
function locCaughtDesc(d,loc){
  const chains=chainsForLoc(loc.id);
  if(!chains.length)return'';
  const totalSpecies=chains.reduce((s,c)=>s+c.stages.length,0);
  const caughtSpecies=chains.reduce((s,c)=>{const idx=d.progress[c.id];return s+(idx!==undefined?idx+1:0);},0);
  const allDone=chains.every(c=>d.progress[c.id]===c.stages.length-1);
  return'Спіймано: '+caughtSpecies+'/'+totalSpecies+(allDone?' ✓':'');
}
function renderActions(){
  const d=pd();
  const loc=cLoc();
  let html;
  if(loc.id==='map2'){
    html=`<div class="act-row" onclick="enterJohto()"><div class="act-icon">🌏</div><div class="act-body"><div class="act-title">Перейти до Регіону Джото</div><div class="act-desc">Новий регіон відкрито — покемони чекають попереду!</div></div></div>`;
  } else if(loc.id==='newbark'){
    html=`<div class="act-row" onclick="returnToKanto()"><div class="act-icon">🗺️</div><div class="act-body"><div class="act-title">Повернутись до Регіону Канто</div></div></div>`;
  } else {
    const pool=catchableStages(loc.id);
    if(!pool.length){
      html=`<button class="catch-btn done">✓ Усі покемони тут спіймані!</button>`;
    } else {
      html=`<button class="catch-btn" onclick="doCatch()">Ловити покемона <span class="catch-cost">1📙</span></button>`;
    }
  }
  document.getElementById('act-list').innerHTML=html;
  renderGoalWidget();
}

function doCatch(){
  const d=pd();
  if(d.bookPoints<1){
    qM(()=>mHTML(`${M_CLOSE_BTN}<div class="m-emoji">📙</div><div class="m-title">Мало книжкових балів</div><div class="m-desc">Прочитай книгу, щоб отримати 📙 і зловити покемона!</div><div style="display:flex;justify-content:center;margin-top:4px"><button class="btn-ok" style="flex:none;padding:10px 24px" onclick="closeModal();openSidePanel()">Додати книгу</button></div>`));
    return;
  }
  const pool=catchableStages(d.location);
  if(!pool.length){showToast('Тут усі покемони вже спіймані!');return;}
  const beforeAch=fullyCompletedKeys(d);
  d.bookPoints--;
  const pick=pool[ri(0,pool.length-1)];
  d.progress[pick.chain.id]=pick.idx;
  touchProgressOrder(d,pick.chain.id);
  const stage=pick.chain.stages[pick.idx];
  renderRes();renderDex();renderActions();renderMap();
  const opened=checkUnlocks();
  if(opened.length)renderMap();
  // Обої позначаємо ДО збереження, щоб вони поїхали в хмару разом із самим
  // відкриттям, а не окремим рейсом із власною міткою часу.
  const openedPairs=openedWithWalls(opened);
  saveToCloud(cur);
  qM(()=>mImg(img(stage.pid),'Спіймано '+stage.name+'!','Тепер у твоїй колекції.',[{l:'Чудово!',ok:true,cb:closeModal}]));
  // Спершу локація (разом зі своїми обоями), і лише потім ачівки: відкриття
  // локації — головна новина, ачівка поряд з нею дрібніша.
  queueOpenedLocs(openedPairs);
  celebrateNewAchievements(d,beforeAch);
}

// ═══════════ SHOP (buy pokemon for coins) ═══════════
function chainKeyLoc(chainId){
  const d=pd();
  return Object.values(LOCS).find(loc=>!d.unlockedLocs.includes(loc.id)&&loc.unlockReq&&loc.unlockReq.type==='keyChain'&&loc.unlockReq.chainId===chainId);
}

function _buildShopHTML(){
  const d=pd();
  const rows=[];
  d.unlockedLocs.forEach(locId=>{
    chainsForLoc(locId).forEach(chain=>{
      const idx=nextStageIdx(d,chain);
      if(idx>=chain.stages.length)return;
      rows.push({chain,idx,stage:chain.stages[idx],price:stagePrice(chain,idx)});
    });
  });
  rows.sort((a,b)=>{
    const ak=chainKeyLoc(a.chain.id)&&a.idx===chainKeyLoc(a.chain.id).unlockReq.stageIdx?1:0;
    const bk=chainKeyLoc(b.chain.id)&&b.idx===chainKeyLoc(b.chain.id).unlockReq.stageIdx?1:0;
    return bk-ak;
  });
  const html=rows.map(r=>{
    const keyLoc=chainKeyLoc(r.chain.id);
    let keyNote='';
    if(keyLoc){
      keyNote=r.idx===keyLoc.unlockReq.stageIdx
        ?`<div style="margin-top:3px;font-size:9px;font-weight:700;color:var(--ok)">🔑 Відкриє «${keyLoc.name}»!</div>`
        :`<div style="margin-top:3px;font-size:9px;color:var(--gold)">→ веде до ключа «${keyLoc.name}»</div>`;
    }
    return`<div class="shop-row" ${keyLoc&&r.idx===keyLoc.unlockReq.stageIdx?'style="background:rgba(var(--ok-rgb),.06);border-radius:8px;padding:8px 6px;margin:0 -6px"':''}>
      <img class="sh-emoji" src="${img(r.stage.pid)}" style="width:40px;height:40px;image-rendering:pixelated" onerror="this.style.display='none'">
      <div class="sh-info"><div class="sh-name">${r.stage.name}</div><div class="sh-desc">${r.chain.stages.length>1?'Стадія '+(r.idx+1)+'/'+r.chain.stages.length:'Локація: '+(LOCS[r.chain.loc]?.name||'')}</div>${keyNote}</div>
      <div style="text-align:right;flex-shrink:0"><div class="sh-price">🪙${r.price}</div>
      <button class="sh-btn" onclick="buyChainStage('${r.chain.id}',${r.idx})" ${d.coins<r.price?'disabled':''}>Купити</button></div>
    </div>`;
  }).join('');
  return`${M_CLOSE_BTN}<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-right:26px">
    <div class="m-title" style="margin:0">🛒 Магазин</div>
    <div style="font-size:14px;font-weight:700;color:var(--gold)">🪙${d.coins}</div>
  </div><div style="max-height:340px;overflow-y:auto;padding-right:10px;margin-right:-10px">${html||'<div style="font-size:12px;color:var(--txt-4);text-align:center;padding:1rem">Немає нічого на продаж — спочатку відкрий локації!</div>'}</div>`;
}
function openShop(){
  const box=document.querySelector('#mOv .modal-box');
  if(box){box.innerHTML=_buildShopHTML();return;}
  mHTML(_buildShopHTML(),true);
}

let _shopFlowQueue=[];
function buyChainStage(chainId,idx){
  const d=pd();const chain=CHAINS.find(c=>c.id===chainId);if(!chain)return;
  const price=stagePrice(chain,idx);
  if(d.coins<price)return;
  const beforeAch=fullyCompletedKeys(d);
  d.coins-=price;d.progress[chainId]=idx;
  d.totalBought=(d.totalBought||0)+1;
  d.totalCoinsSpent=(d.totalCoinsSpent||0)+price;
  touchProgressOrder(d,chainId);
  renderRes();renderDex();renderActions();renderMap();
  const opened=checkUnlocks();
  if(opened.length)renderMap();
  const openedPairs=openedWithWalls(opened);   // до збереження — див. openedWithWalls
  saveToCloud(cur);
  const newAch=newlyCompletedAchievements(d,beforeAch);
  // Stay inside the same modal box throughout — swap content in place (bought ->
  // any unlock notices -> any newly-finished achievements -> back to the shop)
  // instead of closing it, so the player lands back in the shop afterward
  // rather than getting bounced out entirely. Achievement celebrations ride
  // this same queue (not qM) so they never fight the shop over the modal box.
  _shopFlowQueue=[
    {type:'bought',pid:chain.stages[idx].pid,name:chain.stages[idx].name},
    // Локація вручається разом зі своїми обоями й ПЕРЕД ачівками — раніше
    // цей шлях не показував обої взагалі, і вони вилітали колись потім.
    ...openedPairs.map(x=>({type:'unlocked',loc:x.loc,wall:x.wall})),
    ...newAch.map(a=>({type:'achievement',achievement:a})),
  ];
  _shopFlowNext();
}
function _shopFlowNext(){
  const box=document.querySelector('#mOv .modal-box');if(!box)return;
  if(_shopFlowQueue.length){
    const item=_shopFlowQueue.shift();
    if(item.type==='bought'){
      box.innerHTML=`${M_CLOSE_BTN}<img class="m-img" src="${img(item.pid)}" onerror="this.style.display='none'"><div class="m-title">Куплено!</div><div class="m-desc" style="text-align:center">${item.name} тепер у твоїй колекції.</div><div class="m-btns"><button class="btn-ok" onclick="_shopFlowNext()">Чудово!</button></div>`;
    } else if(item.type==='unlocked'){
      box.innerHTML=M_CLOSE_BTN+_locOpenedContentHTML(item.loc,item.wall)+
        _locOpenedBtnsHTML(item.wall,'_shopFlowNext()');
    } else {
      box.innerHTML=`${M_CLOSE_BTN}${_achievementCelebrationContentHTML(item.achievement)}<div class="m-btns" style="margin-top:12px"><button class="btn-ok" onclick="_shopFlowNext()">Чудово!</button></div>`;
    }
  } else {
    openShop();
  }
}
