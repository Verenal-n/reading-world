// Нік один і той самий і для входу, і для показу — щоб не було двох різних
// "ніків". Змінюється тут; userId при цьому не змінюється ніколи.
async function renameMe(nick){
  const err=badNickC(nick);
  if(err)return err;
  if(!me)return'Немає активного профілю';
  if(nick===me.nick)return null;
  if(me.guest){
    if(guestRec(nick))return'Профіль з таким ніком уже є на цьому пристрої';
    const rec=guestRec(me.nick);
    if(!rec)return'Не знайдено профіль гостя';
    localStorage.removeItem(guestKey(me.nick));
    rec.nick=nick;
    lsSet(guestKey(nick),rec);
  }else{
    const r=await _api({action:'setNick',userId:me.userId,token:me.token,nick:nick});
    if(!r||!r.ok)return r&&r.error==='network'
      ?"Немає зв'язку з сервером"
      :(r&&r.error)||'Не вдалося змінити нік';
  }
  me.nick=nick;
  lsSet(LS_SESSION,me);
  setPlayers(me.userId,nick);
  return null;
}

async function saveProfileSettings(){
  const d=pd();

async function submitChangePass(){
  const oldP=_v('cp-old'),n1=_v('cp-new'),n2=_v('cp-new2');
  const errEl=document.getElementById('cp-err');
  const btn=document.getElementById('cp-submit');
  function fail(m){
    if(errEl){errEl.textContent=m;errEl.style.display='block';}
    if(btn){btn.disabled=false;btn.textContent='Зберегти';}
  }
  if(n1!==n2){fail('Нові паролі не збігаються');return;}
  const bad=badPassC(n1);
  if(bad){fail(bad);return;}
  if(btn){btn.disabled=true;btn.textContent='Зберігаємо…';}
  if(me.guest){
    if(!cryptoOk()){fail('Недоступно в цьому режимі');return;}
    if(!(await guestCheck(me.nick,oldP))){fail('Невірний поточний пароль');return;}
    const rec=guestRec(me.nick);
    rec.salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    rec.hash=await _sha256(rec.salt+'|'+n1);
    lsSet(guestKey(me.nick),rec);
  }else{
    const r=await _api({action:'changePass',userId:me.userId,token:me.token,password:oldP,newPassword:n1});
    if(!r||!r.ok){
      fail(r&&r.error==='network'?"Немає зв'язку з сервером":(r&&r.error)||'Не вдалося змінити пароль');
      return;
    }
    me.token=r.token;   // сервер видав новий токен, старі сесії злетіли
    lsSet(LS_SESSION,me);
  }
  closeModal();
  showToast('Пароль змінено');
}

function starRatingHTML(rating,editable,onClickFnName){
  rating=rating||0;
  let stars='';
  for(let i=1;i<=5;i++){
    const fillPct=Math.max(0,Math.min(100,(rating-(i-1))*100));
    stars+=`<span class="star-slot" ${editable?`onclick="${onClickFnName}(event,${i})"`:''}>
      <span class="star-bg">★</span><span class="star-fg" style="width:${fillPct}%">★</span>
    </span>`;
  }
  return`<div class="star-rating ${editable?'editable':''}">${stars}</div>`;
}
function _starClickIsHalf(event){
  const rect=event.currentTarget.getBoundingClientRect();
  return(event.clientX-rect.left)<rect.width/2;
}

const _BPALETTE=[
  ['#6b1f1f','#3a0c0c','#4a1515'],['#1f5858','#0a3030','#153f3f'],
  ['#32206e','#180f42','#221548'],['#5c3d18','#342008','#3f2a0c'],

  ['#1f5c3e','#0a3422','#15402a'],['#622030','#381018','#451520'],
  ['#20386b','#0a1e3c','#152848'],['#4a1f5c','#28083a','#331540'],
  ['#1f4a3e','#0a2a22','#15352a'],
  ['#7a3a12','#42200a','#5c2d0e'],['#7a2f2f','#421818','#5c2323'],

  ['#4a2f8a','#241548','#372066'],['#8a2f1f','#48170f','#6b2417'],
  ['#1f6b5c','#0f3a32','#174f43'],['#4f5c1f','#2a300f','#3d4517'],
  ['#3a4a5c','#1f2830','#2d3a45'],['#6b3f1f','#3a220f','#4f2f17'],
  ['#6b1f3a','#380f1f','#4f172d'],['#1f5c6b','#0f323a','#17454f'],
  ['#8a5c1f','#483010','#6b4717'],
];
function _colorFor(title){let h=0;for(const c of title)h=(h*31+c.charCodeAt(0))%_BPALETTE.length;return _BPALETTE[Math.abs(h)];}
function _bookH(p){if(p<100)return 178;if(p<250)return 190;if(p<400)return 202;if(p<600)return 214;if(p<800)return 224;if(p<1000)return 234;return 244;}
function _coverW(p){if(p<100)return 90;if(p<250)return 100;if(p<400)return 108;if(p<600)return 114;if(p<800)return 119;if(p<1000)return 123;return 127;}
function _spineW(p){const[A,B,C,D]=[40,1500,6,65];const r=(Math.log(Math.max(p,A))-Math.log(A))/(Math.log(B)-Math.log(A));return Math.round(C+r*(D-C));}
function _titleSz(text,cw){const b=cw<100?10:cw<115?11:12;if(text.length>30)return b-1;if(text.length>18)return b;return b+1;}

function _renderBookPreviewHTML(book){
  const p=book.pages||1;
  const h=_bookH(p),sw=_spineW(p);
  const coverUrl=book.coverUrl||null;
  const cw=coverUrl?Math.round(h*2/3):_coverW(p);
  const [top,bot,spine]=_colorFor(book.title);
  const scale=0.58;
  const vh=Math.round(h*scale),vw=Math.round((sw+cw+6)*scale);
  const spineGrad=`linear-gradient(90deg,${bot} 0%,${spine} 40%,${top} 100%)`;
  const coverGrad=`linear-gradient(150deg,${top} 0%,${bot} 100%)`;
  const tsz=_titleSz(book.title,cw);
  const inner=`<div style="display:flex;flex-direction:row;height:${h}px;flex-shrink:0">
    <div style="width:${sw}px;height:${h}px;background:${spineGrad};display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 2px 0 5px rgba(255,255,255,.06),inset -3px 0 8px rgba(0,0,0,.45)">
      ${sw>=12?`<span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:${Math.max(7,sw>20?9:8)}px;font-weight:700;color:rgba(255,255,255,.7);white-space:normal;word-break:break-word;text-align:center;overflow:visible;max-height:${h-16}px">${book.title}</span>`:''}
    </div>
    <div style="width:${cw}px;height:${h}px;background:${coverGrad};position:relative;overflow:hidden;box-shadow:2px 2px 0 rgba(var(--shadow),.3),4px 5px 0 rgba(var(--shadow),.18),6px 10px 20px rgba(var(--shadow),.55)">
      ${coverUrl?`<img src="${coverUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`:''}
      ${!coverUrl?`<div style="position:absolute;inset:0">
        <div style="position:absolute;top:9px;left:5px;right:5px;font-size:8px;opacity:.5;text-transform:uppercase;letter-spacing:.08em;color:#fff">${book.author||''}</div>
        <div style="position:absolute;top:50%;left:5px;right:5px;transform:translateY(-50%);font-size:${tsz}px;font-weight:800;text-align:center;color:#fff;white-space:normal;word-break:break-word">${book.title}</div>
        <div style="position:absolute;bottom:6px;left:5px;right:5px;font-size:8px;opacity:.45;color:#fff;text-align:right">${p} стор.</div>
      </div>`:''}
    </div>
  </div>`;
  return`<div style="width:${vw}px;height:${vh}px;overflow:hidden;margin:0 auto 12px"><div style="width:${sw+cw}px;transform:scale(${scale});transform-origin:top left">${inner}</div></div>`;
}

function _renderBookHTML(book, i, sc=1){
  const p=book.pages||1;
  const h=Math.round(_bookH(p)*sc);
  const coverUrl=book.coverUrl||null;
  const cw=coverUrl?Math.round(h*2/3):Math.round(_coverW(p)*sc);
  const [top,bot]=_colorFor(book.title);
  const tsz=Math.max(7,Math.round(_titleSz(book.title,cw)*sc));
  const fsz=Math.max(6,Math.round(8*sc));
  const coverGrad=`linear-gradient(150deg,${top} 0%,${bot} 100%)`;

  books.forEach((b,i)=>{

// Дата в підписі — по-людськи: «30 червня 2026», а не 2026-06-30.
const UA_MONTHS=['січня','лютого','березня','квітня','травня','червня',
                 'липня','серпня','вересня','жовтня','листопада','грудня'];
// Дата книги живе у ДВОХ полях: ts — мітка часу додавання (головне джерело),
// date — рядок для показу в локальному форматі ДД.ММ.РРРР (так його пише
// форма додавання). Тому і рік, і порядок беремо з ts, а не з рядка:
// "02.09.2026".slice(0,4) дає "02.0", а сортування рядком ставить 2 вересня
// перед 15 січня. ISO лишаємо третім варіантом — для старих чи підставлених
// даних.
function bookTime(b){
  if(!b)return 0;
  if(b.ts)return +b.ts||0;
  const s=String(b.date||'');
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1]).getTime();
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]).getTime();
  return 0;
}
function bookYearKey(b){const t=bookTime(b);return t?String(new Date(t).getFullYear()):'—';}
// День книги зберігався ДВІЧІ: `ts` (мітка часу) і `date` («02.09.2026»).
// Два джерела правди — це той самий баг, на якому «Подорож» уже спіткнулась:
// вона читала рік із `date`, а формат був інший, і всі книги падали в
// «без дати». Тепер джерело одне — `ts`, а рядок для показу малює uaDate().
//
// Старі сейви переносимо на вході, максимально обережно:
//   • є ts → просто прибираємо `date`;
//   • ts немає → дістаємо його з `date` (bookTime розбирає і «02.09.2026»,
//     і ISO), і лише ПОТІМ прибираємо `date`;
//   • день дістати не вдалось → книгу НЕ чіпаємо. Краще зайве поле, ніж
//     втрачений день.
function migrateBookDates(d){
  if(!d||!Array.isArray(d.books))return false;
  let changed=false;
  d.books.forEach(b=>{
    if(!b||typeof b!=='object'||!('date' in b))return;
    if(!b.ts){
      const t=bookTime(b);
      if(!t)return;
      b.ts=t;
    }
    delete b.date;
    changed=true;
  });
  return changed;
}
function uaDate(b){
  const t=bookTime(b);
  if(!t)return String((b&&b.date)||'');
  const d=new Date(t);
  return d.getDate()+' '+UA_MONTHS[d.getMonth()]+' '+d.getFullYear();
}
// «Відкривається на поточній книзі» — тобто на останній прочитаній: вона в
// кінці дороги, тому докручуємо вниз так, щоб вона стала по центру екрана.
function _jnScrollToLatest(){
  const wrap=document.getElementById('jn-wrap');
  const sc=document.querySelector('.main-content');
  if(!wrap||!sc)return;
  const nodes=wrap.querySelectorAll('.jn-node');
  if(!nodes.length)return;
  const last=nodes[nodes.length-1];
  const y=wrap.offsetTop+parseFloat(last.style.top||'0');
  sc.scrollTop=Math.max(0,y-sc.clientHeight/2);

// ═══════════ ЖАНРИ ═══════════
// Вертикальний стовп, від кожного жанру — своя кольорова доріжка з книгами.
// Жанр, у якому ще нічого не прочитано, теж малюється: доріжка йде й
// закінчується нічим. Це і є та сама «дорога в нікуди» — видно, куди ще не
// ходив, а не просто відсутній рядок.
const GN_PER_ROW=5;      // скільки обкладинок у рядок, далі доріжка завертає
const GN_ROW_H=100;      // висота рядка: смуга + ніжка + обкладинка + просвіт
const GN_BAND=8;         // де в рядку проходить сама смуга
const GN_X1=6, GN_X2=94; // відсотки: межі смуги (лишаємо місце на розворот)
function _gnColor(g){return GENRE_COLORS[g]||GENRE_COLORS['Інше'];}

function _buildGenreHTML(books){
  // Порядок: спершу жанри з книгами (більші вище), потім порожні — щоб
  // «дороги в нікуди» не розсовували те, що вже прочитано.
  const withIdx=books.map((b,i)=>({b,i}));
  const byGenre={};
  withIdx.forEach(({b,i})=>{
    if(!b.genre)return;                 // без жанру — не жанр, на дорогах не показуємо
    const g=GENRES.includes(b.genre)?b.genre:'Інше';
    (byGenre[g]||(byGenre[g]=[])).push({b,i});
  });
  Object.values(byGenre).forEach(l=>l.sort((x,y)=>bookTime(x.b)-bookTime(y.b)));
  const filled=GENRES.filter(g=>byGenre[g]&&byGenre[g].length);
  const empty=GENRES.filter(g=>!byGenre[g]||!byGenre[g].length);
  const order=filled.slice().sort((a,b)=>byGenre[b].length-byGenre[a].length);
  const together=qGenresDone();


  let seq=0;
  const block=g=>{
    const gid=++seq;                 // id градієнтів унікальні на всю сторінку
    const list=byGenre[g]||[];
    const n=list.length;
    const name=g;
    const clr=_gnColor(g);
    const rows=Math.max(1,Math.ceil(n/GN_PER_ROW));
    // Порожньому жанру місце під обкладинки не потрібне: лишається сама
    // смуга, інакше десяток «доріг у нікуди» роздув би вигляд утричі.
    const H=n?rows*GN_ROW_H:GN_BAND+18;
    const slot=(GN_X2-GN_X1)/GN_PER_ROW;

    // ── доріжка ──
    // Суцільний контур (для «обочини» кольору жанру й пунктирної розділової)
    // і окремо покриття, розбите на відрізки між сусідніми книгами: кожен
    // відрізок перетікає з кольору однієї книги в колір наступної, як у
    // «Подорожі». Колір жанру нікуди не зникає — він лишається в чіпі,
    // крапці на стовпі та обочині під покриттям.
    const rowY=r=>r*GN_ROW_H+GN_BAND;
    const ltrOf=r=>r%2===0;
    const rowStart=r=>ltrOf(r)?GN_X1:GN_X2;
    const rowEnd=r=>ltrOf(r)?GN_X2:GN_X1;
    const bookX=k=>{
      const r=Math.floor(k/GN_PER_ROW);
      let col=k%GN_PER_ROW;
      if(!ltrOf(r))col=GN_PER_ROW-1-col;
      return GN_X1+(col+0.5)*slot;
    };
    let d='';
    for(let r=0;r<rows;r++){
      const y=rowY(r);
      d+=`M ${rowStart(r)} ${y} L ${rowEnd(r)} ${y} `;
      if(r<rows-1){
        const y2=rowY(r+1);
        const cx=ltrOf(r)?99:1;               // випуклість розвороту
        d+=`C ${cx} ${y}, ${cx} ${y2}, ${rowEnd(r)} ${y2} `;

    }

    const road=`<svg class="gn-road" height="${H}" viewBox="0 0 100 ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>${defs}</defs>
      <path d="${d}" fill="none" stroke="${clr}" stroke-width="${n?10:9}" stroke-linecap="round"
        ${dashed?'stroke-dasharray="3 9"':''} vector-effect="non-scaling-stroke"
        style="opacity:${dashed?'.34':'var(--jn-road-op)'}"/>
      <g style="opacity:.85">${surface}</g>
    </svg>`;

    // ── обкладинки на ніжках під смугою ──
    const items=list.map(({b,i},k)=>{
      const r=Math.floor(k/GN_PER_ROW);
      let col=k%GN_PER_ROW;
      if(r%2===1)col=GN_PER_ROW-1-col;        // зворотний хід у зворотному рядку
      const x=GN_X1+(col+0.5)*slot;
      const y=r*GN_ROW_H+GN_BAND;
      const[top,bot]=_colorFor(b.title);
      const cover=escUrl(b.coverUrl)
        ?`<img class="gn-cover" src="${escUrl(b.coverUrl)}" loading="lazy" alt="" onerror="this.style.display='none'">`
        :`<div class="gn-cover-ph" style="background:linear-gradient(150deg,${top},${bot})">${esc(b.title)}</div>`;
      return`<div class="gn-stem" style="top:${y}px;left:${x}%"></div>
        <div class="gn-book" style="left:${x}%;top:${y+16}px" onclick="openBookDetail(${i})" title="${esc(b.title)}${b.author?' · '+esc(b.author):''}">
          ${cover}${b.q?`<span class="gn-q" title="Прочитано разом: ${esc(b.q.n)}">🤝</span>`:''}${b.rating?`<div class="gn-star">★${esc(b.rating)}</div>`:''}
        </div>`;
    }).join('');

    return`<div class="gn-block" style="height:${H+(n?40:28)}px">
      <div class="gn-hdr">
        <span class="gn-dot" style="background:${clr}"></span>
        <span class="gn-name" style="background:${clr}">${esc(name)}${together[g]?` <span title="Пройдено разом: ${esc(together[g].join(', '))}">🤝</span>`:''}</span>
        ${n?`<span class="gn-count">${n}</span>`:`<span class="gn-empty">ще не пройдено</span>`}
      </div>
      <div style="position:relative;height:${H}px">${road}${items}</div>
    </div>`;
  };

  return`<div class="gn-wrap"><div class="gn-trunk"></div>
    ${order.map(block).join('')}${empty.map(block).join('')}</div>`;
}

// ═══════════ CLOUD SAVE ═══════════
// Обкладинки не їдуть у блобі сейву: посилання з Goodreads по ~130 символів,
// на сотні книг це майже 40% обсягу. Тому в хмару блоб їде без них, а
// обкладинки — окремим стовпцем; бекенд ріже і те, і те на куски по
// клітинках, тому ліміт клітинки в 50 000 символів більше не стеля.
// У localStorage лишається ПОВНИЙ стан: там бюджет інший, і офлайн
// обкладинки мусять бути на місці.
// Ключ — назва+автор у нормалізованому вигляді (той самий reaxKey), бо
// індекс книги зсувається при видаленні, а id у книжок немає.
function splitCovers(d){
  const covers={};
  const books=(d.books||[]).map(b=>{
    if(!b||!b.coverUrl)return b;
    covers[reaxKey(b.title,b.author)]=b.coverUrl;
    const c=Object.assign({},b);
    delete c.coverUrl;
    return c;
  });
  const qd=(d.questsDone||[]).map(r=>{
    if(!r||!r.their||!r.their.c)return r;
    covers['q:'+r.id]=r.their.c;
    const c=Object.assign({},r,{their:Object.assign({},r.their)});
    delete c.their.c;
    return c;
  });
  return{slim:Object.assign({},d,{books:books,questsDone:qd}),covers:covers};
}
function mergeCovers(d,raw){
  let covers={};
  try{covers=raw?(typeof raw==='string'?JSON.parse(raw):raw):{};}catch(e){covers={};}
  (d&&d.books||[]).forEach(b=>{
    if(b&&!b.coverUrl){
      const u=covers[reaxKey(b.title,b.author)];
      if(u)b.coverUrl=u;
    }
  });
  (d&&d.questsDone||[]).forEach(r=>{
    if(r&&r.their&&!r.their.c){const u=covers['q:'+r.id];if(u)r.their.c=u;}
  });
  return d;
}
function showSaveStatus(s){
  const el=document.getElementById('save-status');if(!el)return;

  if(s==='saving'){el.textContent='💾';el.style.color='var(--gold)';el.style.visibility='visible';}
  else if(s==='saved'){el.textContent='✓';el.style.color='var(--ok)';el.style.visibility='visible';_saveTimer=setTimeout(()=>el.style.visibility='hidden',2000);}
  else if(s==='error'){el.textContent='⚠️';el.style.color='var(--bad-solid)';el.style.visibility='visible';_saveTimer=setTimeout(()=>el.style.visibility='hidden',3500);}
  else{el.style.visibility='hidden';}
}

let _jsonpSeq=0;
function _jsonp(url){
  return new Promise(resolve=>{
    const cb='_rpg'+(++_jsonpSeq);
    const s=document.createElement('script');
    const t=setTimeout(()=>{console.warn('[JSONP] timeout:',url.substring(0,80));delete window[cb];s.remove();resolve(null);},15000);
    window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();resolve(d);};
    s.onerror=(e)=>{console.error('[JSONP] script error:',e);clearTimeout(t);delete window[cb];s.remove();resolve(null);};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    console.log('[JSONP] →',url.substring(0,120)+'...');
    document.head.appendChild(s);
  });
}

let _pubWarned=0,_saveWarnTs=0;
// Хмарний рейс іде ПО ОДНОМУ на гравця, і це не про трафік. Два паралельні
// POST-и — це втрата даних: повільніший може фінішувати останнім, і в
// таблиці лишиться СТАРІШИЙ стан. Тому поки один рейс у дорозі, наступні
// виклики лише піднімають прапорець, а коли він повернеться — відправляється
// ОДИН запит із тим, що в пам'яті на той момент. Заодно три тапи в
// налаштуваннях бібліотеки перестають заливати всю бібліотеку тричі.
const _saveBusy={};    // pid → проміс рейсу, що зараз у дорозі
const _saveAgain={};   // pid → поки рейс ішов, просили зберегти ще раз
async function saveToCloud(pid){
  if(!pid)return;
  // Мітка часу збереження — по ній loadStateFor вирішує, чия копія новіша.
  if(state.players[pid])state.players[pid]._ts=Date.now();
  const stateJson=JSON.stringify(state.players[pid]);
  saveLocal('rpg_state_'+pid,stateJson);
  // Гість у хмару не пишеться взагалі — його на сервері не існує.
  if(!me||me.guest||!me.token||!SCRIPT_URL)return;
  // Уже їдемо — досить позначити, що дані змінились після відправки.
  if(_saveBusy[pid]){_saveAgain[pid]=1;return _saveBusy[pid];}
  const run=(async()=>{
    do{_saveAgain[pid]=0;await _pushSave(pid);}while(_saveAgain[pid]);
  })().then(()=>{delete _saveBusy[pid];delete _saveAgain[pid];});
  _saveBusy[pid]=run;
  return run;
}
async function _pushSave(pid){
  showSaveStatus('saving');
  const split=splitCovers(state.players[pid]);
  // POST (not GET+JSONP) — a big library of books would otherwise blow past the
  // URL-length limit on a GET request and silently fail to save anything at all.
  const r=await _api({action:'save',userId:me.userId,token:me.token,
                      state:JSON.stringify(split.slim),
                      covers:JSON.stringify(split.covers),
                      pub:JSON.stringify(buildPublicSummary(state.players[pid]))});
  if(r&&r.ok){
    showSaveStatus('saved');
    // Зліпок для друзів не влазив у стовпчик: друзі бачили б застиглі числа.
    if(r.pubSkipped&&!_pubWarned){_pubWarned=1;showToast('Дані для друзів завеликі — напиши мені');}
    return;
  }
  showSaveStatus('error');
  if(r&&r.error==='auth')showToast('Сесія закінчилась — увійди знову');
  // Причину провалу видно лише тут: без цього ⚠️ нічого не пояснює.
  else if(r&&r.error&&r.error!=='network'&&Date.now()-_saveWarnTs>60000){
    _saveWarnTs=Date.now();showToast(r.error);
  }
}

// ═══════════ LOC ICONS — individual files ═══════════
// Картинки віддаються з GitHub Pages з max-age=600, тобто щодесять хвилин
// качаються заново. Тому вони переведені у WebP: ті самі малюнки важать 0,5 МБ
// замість 17 МБ (мапа 7 МБ → 172 КБ).
//
// Відступ — JPEG того самого розміру (311 КБ на всі): він страхує і випадок
// «файл ще не залитий», і пристрій, застарий для WebP (iOS до 14). PNG-и,
// з яких це зроблено, у репозиторії більше не потрібні.
function locImgFail(el,em){
  if(!el)return;
  if(!el.dataset.alt){el.dataset.alt='1';el.src=el.dataset.base+'.jpg';return;}
  const p=el.parentElement;if(!p)return;
  p.style.cssText+='display:flex;align-items:center;justify-content:center;font-size:'+(el.dataset.fs||24)+'px';
  p.textContent=em||'?';
}
function locIconEl(locId,size=64){
  const FILES={oak:'loc_oak',pallet:'loc_pallet',forest:'loc_forest',
               glade:'loc_glade',butterfly:'loc_butterfly',caves:'loc_caves',
               shore:'loc_shore',map2:'loc_map2'};
  const src=FILES[locId];
  const loc=_anyLoc(locId);
  if(!src) return`<div style="font-size:${Math.round(size*.55)}px;text-align:center;line-height:${size}px;width:${size}px;height:${size}px;margin:0 auto">${loc?loc.emoji:''}</div>`;
  const em=loc?loc.emoji:'?';
  return`<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;margin:0 auto;flex-shrink:0"><img src="${src}.webp"
    data-base="${src}" data-fs="${Math.round(size*.55)}" loading="lazy" decoding="async"
    style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block"
    onerror="locImgFail(this,'${em}')"></div>`;
}

// Одна дрібна перевірка: беремо найлегший із нових файлів (6 КБ, і він
// однаково потрібен на мапі). Немає webp — ставимо клас, і екран входу
// бере jpg-двійник класики (html.no-webp .sel-bg). Картинки локацій
// і мапи мають свої фолбеки через onerror, тому вони цим класом не
// керуються — і їхні .jpg видаляти не можна.
(function(){const i=new Image();i.onerror=function(){document.documentElement.classList.add('no-webp');};i.src='loc_oak.webp';})();
boot();
window.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&cur)
    saveLocal('rpg_state_'+cur,JSON.stringify(state.players[cur]));
});
</script>
