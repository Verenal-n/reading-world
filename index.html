<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Читальний Світ</title>
<meta name="apple-mobile-web-app-title" content="Читальний Світ">
<style>
/* ═══════════ ТЕМИ ═══════════
   Кольори живуть ТІЛЬКИ тут. Решта CSS і всі inline-стилі в JS беруть їх
   через var(--…). Додати тему = дописати блок html[data-theme="…"] нижче
   і рядок у THEMES у скрипті — більше нічого чіпати не треба.

   --ink, --acc, --gold-rgb… — це трійки каналів, а не кольори: підкладки
   й обідки будуються як rgba(var(--ink),.08). У світлих темах --ink
   темніє, і всі напівпрозорі підкладки самі стають темними на світлому
   замість того, щоб вибілювати його.

   Пари токенів: --gold / --gold-solid, --ok / --ok-solid, --bad /
   --bad-solid. Перший — колір ТЕКСТУ (у світлих темах темний, щоб
   читався), другий — колір ФАРБИ (заливка бейджа, шкали, зірки), він
   лишається яскравим у будь-якій темі. */
:root{
  color-scheme:dark;
  --ink:255,255,255; --shadow:0,0,0;
  --acc:126,206,255; --gold-rgb:251,191,36; --ok-rgb:74,222,128;
  --bad-rgb:239,68,68; --pri-rgb:37,99,235; --tl-rgb:45,212,191;
  --bg:#1a1a2e; --app:#16213e; --panel:#1e2d4a; --panel-rgb:30,45,74;
  --app-rgb:22,33,62; --wall-veil:.78;
  --pop:#243554; --seg-act:#2a3550;
  --chrome:rgba(0,0,0,.45); --chrome-2:rgba(0,0,0,.5);
  --sunken:rgba(0,0,0,.3); --sunken-2:rgba(0,0,0,.2); --sunken-3:rgba(0,0,0,.25);
  --glass:rgba(10,15,35,.82); --scrim:rgba(0,0,0,.72); --scrim-2:rgba(0,0,0,.4);
  --txt-hi:#fff; --txt:#e2e8f0; --txt-2:#b8c2d4; --txt-3:#8a97ad;
  --txt-4:#667487; --txt-5:#3d4757;
  --accent:#7eceff; --accent-2:#3d7ab8;
  --pri:#2563eb; --pri-hi:#1d4ed8; --pri-txt:#fff;
  --gold:#fbbf24; --gold-solid:#facc15; --gold-hi:#fde68a;
  --ok:#4ade80; --ok-solid:#22c55e;
  --bad:#f87171; --bad-2:#fca5a5; --bad-solid:#ef4444;
  --shelf:#111009; --shelf-lbl:#a08a5c;
  --plank-1:#7a5a32; --plank-2:#5a3e1e; --plank-3:#3e2a10; --plank-edge:#9a7a4a;
  --tip-bg:#fff; --tip-txt:#1e2d4a;
  --jn-road-op:.62;
}
/* Обої (--wall) кладуться під інтерфейс і накриваються заслінкою кольору
   теми: --app-rgb дає той самий колір у rgb, --wall-veil — щільність.
   Темним темам достатньо .78, світлим потрібно .82, бо під світлою
   заслінкою картинка блякне швидше. Нижче .70 текст на напівпрозорих
   підкладках уже нечитабельний — саме це перевіряє theme-test.js.
   Обої НЕ залежать від теми: який саме арт — вирішує d.wall. */
/* Екран входу — той самий арт, що й стартові обої «Класика»: перше, що
   людина бачить, вона потім і отримує в грі. Це єдина картинка з jpg-двійником:
   решта обоїв лише webp, бо без них інтерфейс цілком робочий, а тут екран
   лишився б голим. Клас ставить перевірка при завантаженні, див. «картинки». */
html.no-webp .sel-bg{background-image:url('wall_classic.jpg');}
html[data-theme="day"]{
  color-scheme:light;
  --ink:23,37,66; --shadow:100,116,139;
  --acc:3,105,161; --gold-rgb:217,119,6; --ok-rgb:22,163,74;
  --bad-rgb:220,38,38; --pri-rgb:37,99,235; --tl-rgb:13,148,136;
  --bg:#e8ecf3; --app:#f6f8fc; --panel:#fff; --panel-rgb:255,255,255;
  --app-rgb:246,248,252; --wall-veil:.82;
  --pop:#fff; --seg-act:#fff;
  --chrome:rgba(23,37,66,.05); --chrome-2:rgba(23,37,66,.04);
  --sunken:rgba(23,37,66,.035); --sunken-2:rgba(23,37,66,.025); --sunken-3:rgba(23,37,66,.06);
  --glass:rgba(255,255,255,.9); --scrim:rgba(15,23,42,.55); --scrim-2:rgba(15,23,42,.3);
  --txt-hi:#0f172a; --txt:#1e293b; --txt-2:#475569; --txt-3:#5c6a80;
  --txt-4:#7b8794; --txt-5:#9dabbb;
  --accent:#0369a1; --accent-2:#7dd3fc;
  --pri:#2563eb; --pri-hi:#1d4ed8; --pri-txt:#fff;
  --gold:#8f4309; --gold-solid:#f59e0b; --gold-hi:#7c3a08;
  --ok:#146530; --ok-solid:#22c55e;
  --bad:#b91c1c; --bad-2:#dc2626; --bad-solid:#ef4444;
  --shelf:#e6dccb; --shelf-lbl:#7c6242;
  --plank-1:#b08a55; --plank-2:#8d6a3c; --plank-3:#6b4c26; --plank-edge:#c9a878;
  --tip-bg:#0f172a; --tip-txt:#fff;
  --jn-road-op:.3;
}

  color-scheme:light;
  --ink:8,47,73; --shadow:56,110,145;
  --acc:2,132,199; --gold-rgb:202,138,4; --ok-rgb:13,148,136;
  --bad-rgb:225,29,72; --pri-rgb:3,105,161; --tl-rgb:6,148,162;

  --txt-hi:#062b45; --txt:#0c3b5c; --txt-2:#2b6382; --txt-3:#41738f;

  --pri:#0369a1; --pri-hi:#075985; --pri-txt:#fff;
  --gold:#85510a; --gold-solid:#eab308; --gold-hi:#6b400a;
  --ok:#0c5f59; --ok-solid:#14b8a6;
  --bad:#be123c; --bad-2:#e11d48; --bad-solid:#e11d48;

}
html[data-theme="paper"]{
  color-scheme:light;
  --ink:62,44,26; --shadow:120,94,62;
  --acc:146,94,42; --gold-rgb:161,98,7; --ok-rgb:101,163,13;
  --bad-rgb:159,18,57; --pri-rgb:138,90,36; --tl-rgb:15,118,110;
  --bg:#e9dcc6; --app:#f7efe0; --panel:#fffaf1; --panel-rgb:255,250,241;
  --app-rgb:247,239,224; --wall-veil:.82;
  --pop:#fdf6ea; --seg-act:#fffaf1;
  --chrome:rgba(62,44,26,.07); --chrome-2:rgba(62,44,26,.06);
  --sunken:rgba(62,44,26,.05); --sunken-2:rgba(62,44,26,.035); --sunken-3:rgba(62,44,26,.08);
  --glass:rgba(255,250,241,.9); --scrim:rgba(46,35,24,.55); --scrim-2:rgba(46,35,24,.3);
  --txt-hi:#2e2318; --txt:#43331f; --txt-2:#6b5539; --txt-3:#7d6749;
  --txt-4:#8d7a5f; --txt-5:#ad9a7c;
  --accent:#8a5a24; --accent-2:#d9b78a;
  --pri:#8a5a24; --pri-hi:#6f4718; --pri-txt:#fff8ec;
  --gold:#8a5306; --gold-solid:#d99a1e; --gold-hi:#6f400a;
  --ok:#3f6212; --ok-solid:#65a30d;
  --bad:#9f1239; --bad-2:#be123c; --bad-solid:#be123c;
  --shelf:#ddc9ab; --shelf-lbl:#7d6440;
  --plank-1:#b08a55; --plank-2:#8d6a3c; --plank-3:#6b4c26; --plank-edge:#c9a878;
  --tip-bg:#2e2318; --tip-txt:#fdf6ea;
  --jn-road-op:.3;
}
html[data-theme="forest"]{
  color-scheme:dark;
  --acc:110,231,183; --ok-rgb:134,239,172; --pri-rgb:21,128,61;
  --bg:#08150f; --app:#0c2118; --panel:#143425; --panel-rgb:20,52,37;
  --app-rgb:12,33,24; --wall-veil:.78;
  --pop:#1b4530; --seg-act:#1f5138;
  --chrome:rgba(0,0,0,.4); --sunken:rgba(0,0,0,.28);
  --glass:rgba(8,24,17,.82);
  --txt:#e3f0e7; --txt-2:#b6d4c2; --txt-3:#8bab98;
  --txt-4:#628070; --txt-5:#3a4f44;
  --accent:#6ee7b7; --accent-2:#2f8f6a;
  --pri:#15803d; --pri-hi:#166534;
  --ok:#86efac;
  --shelf:#0d0f08; --shelf-lbl:#9a9a5c;
  --tip-txt:#143425;
}
html[data-theme="plum"]{
  color-scheme:dark;
  --acc:216,180,254; --bad-rgb:251,113,133; --pri-rgb:124,58,237;
  --bg:#130a1e; --app:#1c1030; --panel:#2a1740; --panel-rgb:42,23,64;
  --app-rgb:28,16,48; --wall-veil:.78;
  --pop:#372050; --seg-act:#3f2860;
  --chrome:rgba(0,0,0,.4); --sunken:rgba(0,0,0,.28);
  --glass:rgba(20,10,32,.82);
  --txt:#ede4f7; --txt-2:#cdb8e0; --txt-3:#a68cc0;
  --txt-4:#7b649a; --txt-5:#4a3a63;
  --accent:#d8b4fe; --accent-2:#8b5cf6;
  --pri:#7c3aed; --pri-hi:#6d28d9;
  --ok:#6ee7b7;
  --bad:#fb7185; --bad-2:#fda4af; --bad-solid:#f43f5e;
  --shelf:#140d0a;
  --tip-txt:#2a1740;

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--app);position:relative;overflow:hidden;}
/* Клас ставить applyWall(), а не CSS: до входу в гру обоїв нема. Екран
   входу має власну картинку (.sel-bg) і перекриває це повністю. */
html.has-wall .app{
  background-color:var(--app);
  background-image:linear-gradient(rgba(var(--app-rgb),var(--wall-veil)),rgba(var(--app-rgb),var(--wall-veil))),var(--wall);
  background-size:cover;background-position:center top;background-repeat:no-repeat;
}
.screen{display:none;height:100%;flex-direction:column;}.screen.active{display:flex;}

/* SELECT */
/* Назва поверх малюнка. Колір НЕ з токенів свідомо: текст лежить на темному
   куполі картинки, як підписи на мапі, і мусить бути світлим у будь-якій
   гамі (гама тут узагалі профільна, а профіль ще не обраний). */
.sel-title{margin:11vh 0 auto;text-align:center;font-weight:800;line-height:1.1;
  font-size:clamp(26px,7.4vw,40px);color:#fff;letter-spacing:.005em;
  text-shadow:0 2px 14px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.6);}
.sel-bg{background:url('wall_classic.webp') center top/cover no-repeat;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 1rem calc(6rem + env(safe-area-inset-bottom, 0px));overflow-y:auto;}
.spill{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;background:rgba(var(--acc),.15);color:var(--accent);display:inline-block;margin:2px 1px;}

/* LOGIN */
.login-box{background:var(--glass);border:1px solid rgba(var(--ink),.15);backdrop-filter:blur(8px);border-radius:18px;padding:1.1rem 1rem;}
.login-tabs{display:flex;gap:4px;background:var(--sunken-3);border-radius:14px;padding:3px;margin-bottom:14px;}
.login-tab{flex:1;padding:8px 0;font-size:12px;font-weight:600;border-radius:11px;border:none;background:transparent;color:var(--txt-3);cursor:pointer;font-family:inherit;}
.login-tab.act{background:rgba(var(--acc),.16);color:var(--accent);}
.login-btn{width:100%;padding:13px;font-size:14px;font-weight:600;border:none;border-radius:12px;background:var(--pri);color:var(--pri-txt);cursor:pointer;font-family:inherit;min-height:46px;}
.login-btn:hover{background:var(--pri-hi);}
.login-btn[disabled]{opacity:.55;cursor:default;}
.login-err{font-size:11.5px;color:var(--bad-2);background:rgba(var(--bad-rgb),.12);border:1px solid rgba(var(--bad-rgb),.3);border-radius:9px;padding:7px 9px;margin-bottom:10px;display:none;}
.login-warn{font-size:10.5px;line-height:1.45;color:var(--gold);background:rgba(var(--gold-rgb),.1);border:1px solid rgba(var(--gold-rgb),.28);border-radius:9px;padding:8px 9px;margin-bottom:10px;}
.pw-wrap{position:relative;}
.pw-wrap .finput{padding-right:74px;}
.pw-eye{position:absolute;right:6px;top:6px;background:rgba(var(--acc),.12);border:1px solid rgba(var(--acc),.25);border-radius:7px;color:var(--accent);font-size:10px;font-weight:600;padding:5px 8px;cursor:pointer;font-family:inherit;}
.disclaimer{font-size:9.5px;line-height:1.4;color:var(--txt-3);text-align:center;margin-top:14px;padding-top:10px;border-top:1px solid rgba(var(--ink),.08);}

/* FRIENDS */
.bottom-tab{position:relative;}
.tab-badge{position:absolute;top:3px;left:50%;margin-left:6px;min-width:15px;height:15px;border-radius:8px;background:var(--bad-solid);color:#fff;font-size:9px;font-weight:700;line-height:15px;text-align:center;padding:0 3px;}
.fr-card{display:flex;gap:9px;align-items:flex-start;background:rgba(var(--ink),.05);border:1px solid rgba(var(--ink),.09);border-radius:14px;padding:9px 10px;margin-bottom:8px;}
.fr-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;}
.fr-main{flex:1;min-width:0;}
.fr-nick{font-size:13px;font-weight:700;color:var(--txt-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fr-loc{font-size:10px;color:var(--txt-3);margin-top:1px;}
.fr-last{display:flex;gap:6px;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid rgba(var(--ink),.07);}
.fr-last-cover{width:24px;height:34px;border-radius:3px;object-fit:cover;flex-shrink:0;}
.fr-last-txt{flex:1;min-width:0;font-size:10.5px;color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fr-btn{background:rgba(var(--acc),.12);border:1px solid rgba(var(--acc),.28);border-radius:14px;color:var(--accent);font-size:10.5px;font-weight:600;padding:6px 10px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.fr-btn.danger{background:rgba(var(--bad-rgb),.1);border-color:rgba(var(--bad-rgb),.3);color:var(--bad-2);}
.fr-menu-wrap{position:relative;flex-shrink:0;}
.fr-dots{background:none;border:none;color:var(--txt-3);font-size:17px;line-height:1;padding:2px 4px;cursor:pointer;font-family:inherit;}
.fr-dots:hover{color:var(--txt);}
.fr-menu{display:none;position:absolute;top:24px;right:0;z-index:5;background:var(--pop);border:1px solid rgba(var(--ink),.14);border-radius:10px;box-shadow:0 8px 20px rgba(var(--shadow),.45);overflow:hidden;min-width:150px;}
.fr-menu.on{display:block;}
.fr-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--bad-2);font-size:12px;font-weight:600;padding:10px 12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.fr-menu button:hover{background:rgba(var(--bad-rgb),.12);}
.fr-wrap-scroll{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px 4px;}
.fr-btn.ok{background:rgba(var(--ok-rgb),.13);border-color:rgba(var(--ok-rgb),.32);color:var(--ok);}
.fr-empty{text-align:center;color:var(--txt-4);font-size:12px;padding:18px 8px;line-height:1.5;}
.fr-sub{font-size:10px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px;}

/* СПІЛЬНІ КВЕСТИ 🤝 */
.q-card{background:rgba(var(--tl-rgb),.08);border:1px solid rgba(var(--tl-rgb),.3);border-radius:14px;padding:10px 11px;margin-bottom:8px;}
.q-hint{font-size:10.5px;color:var(--txt-3);margin-top:8px;font-style:italic;}
.q-bk{color:var(--txt-3);}
/* дошка пройдених: обкладинки ОБОХ книг поруч */
.q-board{background:rgba(var(--tl-rgb),.06);border:1px solid rgba(var(--tl-rgb),.24);border-radius:14px;padding:10px 11px;margin-bottom:8px;}
.q-board-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
.q-board-g{font-size:12.5px;font-weight:700;color:var(--txt-hi);}
.q-board-d{font-size:10px;color:var(--txt-3);white-space:nowrap;}
.q-pair{display:flex;align-items:flex-start;justify-content:center;gap:14px;}
.q-pair-side{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
.q-pair-n{font-size:10px;color:var(--txt-2);font-weight:600;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.q-pair-plus{font-size:15px;align-self:center;padding-bottom:14px;}
.q-cover{width:54px;height:77px;border-radius:5px;object-fit:cover;box-shadow:0 3px 10px rgba(var(--shadow),.4);}
.q-cover-ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:8.5px;font-weight:700;line-height:1.15;overflow:hidden;overflow-wrap:anywhere;color:rgba(255,255,255,.85);}
.q-hdr{display:flex;gap:9px;align-items:flex-start;}
.q-emoji{font-size:17px;line-height:1.2;flex-shrink:0;}
.q-title{font-size:12.5px;font-weight:700;color:var(--txt-hi);}
.q-sub{font-size:10.5px;color:var(--txt-3);margin-top:1px;}
.q-side{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt-2);margin-top:6px;}
.q-tick{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:700;background:rgba(var(--ink),.07);border:1px solid rgba(var(--ink),.14);color:var(--txt-3);flex-shrink:0;}
.q-tick.on{background:rgba(var(--ok-rgb),.16);border-color:rgba(var(--ok-rgb),.45);color:var(--ok);}
.q-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.q-mark{font-size:11px;flex-shrink:0;}

/* РЕАКЦІЇ ❤️ */
/* Серце — символьний глиф (♡/♥), а не емодзі: емодзі 🤍 має власний білий
   колір і на світлих гамах просто зникало. Глиф фарбується токеном теми. */
.rx-btn{flex-shrink:0;background:rgba(var(--ink),.06);border:1px solid rgba(var(--ink),.14);border-radius:14px;font-size:16px;line-height:1;padding:0 9px;min-height:30px;min-width:36px;cursor:pointer;font-family:inherit;color:var(--txt-3);}
.rx-btn.on{background:rgba(var(--bad-rgb),.14);border-color:rgba(var(--bad-rgb),.45);color:var(--bad);}
.rx-btn[disabled]{opacity:.5;cursor:default;}
.rx-card{display:flex;gap:9px;align-items:flex-start;background:rgba(var(--bad-rgb),.07);border:1px solid rgba(var(--bad-rgb),.22);border-radius:14px;padding:9px 10px;margin-bottom:8px;}
.rx-cover{width:26px;height:37px;border-radius:3px;object-fit:cover;flex-shrink:0;}
.rx-main{flex:1;min-width:0;}
.rx-title{font-size:12px;font-weight:700;color:var(--txt-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* Реакцій на одну книгу може бути багато й від різних друзів. flex-wrap і gap
   тут не косметика: чіпи стають у рядок і переносяться на новий, тому фізично
   не можуть накластись один на одного, скільки б їх не прийшло. */
.rx-who{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;margin-top:5px;}
.rx-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;background:rgba(var(--ink),.06);border:1px solid rgba(var(--ink),.1);border-radius:12px;padding:2px 8px 2px 3px;font-size:10.5px;font-weight:600;color:var(--txt-2);}
.rx-chip-av{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;overflow:hidden;}
.rx-chip-av img{width:100%;height:100%;object-fit:cover;}
.rx-chip-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* GUEST BAR — звичайний flex-елемент над нижнім меню, не fixed:
   так вона фізично не може перекрити ні контент, ні кнопки. */
.guest-bar{display:none;flex-shrink:0;align-items:center;gap:8px;padding:7px 10px;background:rgba(var(--gold-rgb),.13);border-top:1px solid rgba(var(--gold-rgb),.3);}
.guest-bar.on{display:flex;}
.guest-bar-txt{flex:1;font-size:10.5px;line-height:1.35;color:var(--gold);font-weight:600;}
.guest-bar-btn{flex-shrink:0;background:rgba(var(--gold-rgb),.2);border:1px solid rgba(var(--gold-rgb),.45);border-radius:16px;color:var(--gold-hi);font-size:10.5px;font-weight:700;padding:6px 11px;cursor:pointer;font-family:inherit;white-space:nowrap;}

/* HEADER */
.hdr{background:var(--chrome);padding:9px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(var(--ink),.08);flex-shrink:0;}
.hdr-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;}
.hdr-info{display:none;}
.hdr-name{font-size:13px;font-weight:600;color:var(--txt-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-loc{font-size:10px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-res{display:flex;gap:4px;flex-shrink:0;flex-wrap:nowrap;justify-content:flex-end;margin-left:auto;}
.rpill{background:rgba(var(--ink),.1);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--txt-hi);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;}
.rpill-menu{padding:7px 13px;font-size:16px;line-height:1;background:rgba(var(--tl-rgb),.22);border:1px solid rgba(var(--tl-rgb),.45);}
.rpill:hover{background:rgba(var(--ink),.2);}

/* MAIN CONTENT */
.main-content{flex:1;overflow-y:auto;padding:10px;min-height:0;}
.tab-page{height:100%;}

/* BOTTOM TABS */
.bottom-tabs{display:flex;flex-shrink:0;background:var(--chrome-2);border-top:1px solid rgba(var(--ink),.08);}
.bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 calc(6px + env(safe-area-inset-bottom,0px));background:none;border:none;color:var(--txt-3);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;}
.bottom-tab .bt-icon{font-size:19px;line-height:1;}
.bottom-tab.act{color:var(--accent);}

/* DEX */
.sec-title{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.dex-grid{display:flex;flex-direction:row;overflow-x:auto;gap:6px;margin-bottom:10px;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:rgba(var(--ink),.1) transparent;}
.dex-grid::-webkit-scrollbar{height:3px;}.dex-grid::-webkit-scrollbar-thumb{background:rgba(var(--ink),.15);border-radius:2px;}
.dex-card{background:rgba(var(--ink),.05);border:1px solid rgba(var(--ink),.07);border-radius:10px;padding:0 3px 5px;text-align:center;cursor:pointer;transition:all .15s;overflow:hidden;width:68px;flex-shrink:0;position:relative;}
.dex-card:hover{background:rgba(var(--ink),.1);}
.spr-ph{display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:8px;line-height:1.15;padding:2px;color:var(--txt-3);
  background:rgba(var(--ink),.08);border-radius:6px;overflow:hidden;}
.dex-img{width:calc(100% + 6px);height:68px;object-fit:contain;object-position:bottom center;image-rendering:pixelated;margin:0 -3px;display:block;}
.dex-name{font-size:8px;color:var(--txt);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;}
.dex-empty{flex:1;text-align:center;padding:.6rem;color:var(--txt-4);font-size:12px;}
.chain-row{display:flex;flex-direction:row;overflow-x:auto;gap:6px;margin-bottom:10px;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:rgba(var(--ink),.1) transparent;}
.chain-row::-webkit-scrollbar{height:3px;}.chain-row::-webkit-scrollbar-thumb{background:rgba(var(--ink),.15);border-radius:2px;}
.chain-block{background:rgba(var(--gold-rgb),.07);border:1px solid rgba(var(--gold-rgb),.35);border-radius:10px;padding:5px 8px 5px 6px;display:flex;align-items:center;gap:2px;position:relative;flex-shrink:0;overflow:hidden;}
.chain-block-badge{position:absolute;top:0;right:0;background:var(--gold-solid);color:#000;font-size:6px;font-weight:700;padding:1px 5px;border-radius:0 8px 0 5px;letter-spacing:.04em;}
.chain-sprite{cursor:pointer;text-align:center;flex-shrink:0;opacity:.9;transition:opacity .15s;}
.chain-sprite:hover{opacity:1;}
.chain-arrow{color:rgba(var(--gold-rgb),.5);font-size:11px;flex-shrink:0;line-height:1;margin-top:-6px;}

/* MAP */
.map-card{background:var(--sunken);border:1px solid rgba(var(--ink),.07);border-radius:14px;overflow:hidden;margin-bottom:8px;}
#map-region-tabs{background:var(--sunken-2);}
.map-svg{display:block;width:100%;}

/* ACTIONS */
.act-card{background:var(--sunken);border:1px solid rgba(var(--ink),.07);border-radius:14px;overflow:hidden;margin-bottom:8px;}
.act-list{padding:10px;}
.act-row{display:flex;align-items:center;gap:8px;padding:9px 10px;background:rgba(var(--ink),.04);border:1px solid rgba(var(--ink),.05);border-radius:10px;cursor:pointer;transition:all .15s;}
.act-row:hover{background:rgba(var(--ink),.09);border-color:rgba(var(--ink),.12);}
.act-icon{font-size:18px;flex-shrink:0;}
.act-body{flex:1;}
.act-title{font-size:12px;font-weight:600;color:var(--txt-hi);}
.act-desc{font-size:10px;color:var(--txt-3);margin-top:1px;}

/* CATCH BUTTON */
.catch-btn{width:100%;padding:16px;font-size:15px;font-weight:700;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri-hi));color:var(--pri-txt);display:flex;align-items:center;justify-content:center;gap:8px;}
.catch-btn:hover{filter:brightness(1.1);}
.catch-btn.done{background:rgba(var(--ok-rgb),.13);color:var(--ok);cursor:default;border:1px solid rgba(var(--ok-rgb),.3);}
.catch-btn.done:hover{filter:none;}
.catch-cost{font-size:12px;opacity:.9;background:rgba(var(--ink),.18);padding:2px 8px;border-radius:10px;}

/* GOAL WIDGET */
.goal-widget-inner{padding:10px 12px 12px;text-align:center;}
.goal-tabs{display:flex;gap:6px;margin-bottom:8px;background:var(--sunken-3);border-radius:20px;padding:3px;}
.goal-tab{flex:1;padding:5px 0;font-size:11px;font-weight:600;border-radius:16px;border:none;background:transparent;color:var(--txt-3);cursor:pointer;font-family:inherit;}
.goal-tab.act{background:var(--seg-act);color:var(--txt-hi);}
.goal-gauge-wrap{position:relative;width:100%;max-width:190px;margin:0 auto;}
.goal-gauge-svg{display:block;width:100%;}
.goal-gauge-center{position:absolute;left:0;right:0;top:38%;text-align:center;}
.goal-gauge-label{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--txt-3);}
.goal-gauge-value{font-size:22px;font-weight:800;color:var(--txt-hi);line-height:1.1;}
.goal-action-btn{margin-top:4px;padding:8px 20px;font-size:12px;font-weight:600;background:rgba(var(--gold-rgb),.14);border:1px solid rgba(var(--gold-rgb),.35);border-radius:20px;color:var(--gold);cursor:pointer;font-family:inherit;}

/* STATS TAB */
.stats-sub-hdr{font-size:15px;font-weight:700;color:var(--txt-hi);margin-bottom:8px;}
.stats-divider{height:1px;background:rgba(var(--ink),.08);margin:16px 0;}
.stat-tiles{display:flex;gap:8px;margin:10px 0;}
.stat-tile{flex:1;background:rgba(var(--ink),.05);border:1px solid rgba(var(--ink),.07);border-radius:12px;padding:10px 6px;text-align:center;}
.stat-tile-val{font-size:20px;font-weight:800;color:var(--txt-hi);line-height:1.1;}
.stat-tile-lbl{font-size:10px;color:var(--txt-3);margin-top:2px;}
.stats-chart-card{position:relative;background:var(--sunken-2);border:1px solid rgba(var(--ink),.06);border-radius:12px;padding:10px;margin-top:4px;}
.stats-chart-tooltip{position:absolute;transform:translate(-50%,calc(-100% - 8px));background:var(--tip-bg);color:var(--tip-txt);font-size:12px;font-weight:800;padding:3px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(var(--shadow),.35);z-index:5;}
.stats-chart-tooltip::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--tip-bg);}
.stats-chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;}
.stats-year-sel{background:rgba(var(--ink),.07);border:1px solid rgba(var(--ink),.15);border-radius:8px;color:var(--txt-hi);font-size:12px;padding:4px 8px;font-family:inherit;}
.stats-metric-tabs{display:flex;gap:4px;background:var(--sunken-3);border-radius:14px;padding:3px;}
.stats-metric-tab{padding:4px 7px;font-size:10px;font-weight:600;border-radius:10px;border:none;background:transparent;color:var(--txt-3);cursor:pointer;font-family:inherit;white-space:nowrap;}
.stats-metric-tab.act{background:var(--seg-act);color:var(--txt-hi);}
.stats-chart-svg{display:block;width:100%;height:110px;}
.wrap-book-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.wrap-book-card{flex:1 1 140px;display:flex;gap:8px;background:rgba(var(--ink),.04);border-radius:10px;padding:8px;min-width:0;cursor:pointer;}
.wrap-book-info{min-width:0;}
.wrap-book-lbl{font-size:9px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.wrap-book-title{font-size:11px;color:var(--txt-hi);font-weight:600;margin:2px 0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.wrap-book-pages{font-size:14px;color:var(--gold);font-weight:800;}
.wrap-facts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.wrap-fact-row{display:flex;align-items:center;gap:8px;font-size:12px;}
.wrap-fact-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.wrap-fact-lbl{flex:1;color:var(--txt-3);}
.wrap-fact-val{color:var(--txt-hi);font-weight:700;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wrap-month-card{background:rgba(var(--ink),.04);border:1px solid rgba(var(--ink),.07);border-radius:12px;padding:12px;text-align:center;margin-top:4px;}
.wrap-month-lbl{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.wrap-month-name{font-size:15px;color:var(--txt-hi);font-weight:700;}
.wrap-month-count{font-size:19px;color:var(--gold);font-weight:800;margin-top:2px;}
.stats-chart-title{font-size:13px;font-weight:700;color:var(--txt-hi);margin-bottom:10px;}
.lang-donut-row{display:flex;align-items:center;gap:14px;}
.lang-donut-svg{width:110px;height:110px;flex-shrink:0;}
.lang-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.lang-legend-row{display:flex;align-items:center;gap:6px;font-size:11px;}
.lang-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lang-legend-lbl{color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lang-legend-val{color:var(--txt-hi);font-weight:700;flex-shrink:0;margin-left:2px;}
.star-rating{display:flex;gap:2px;justify-content:center;}
.star-slot{position:relative;font-size:24px;line-height:1;color:rgba(var(--ink),.15);}
.star-rating.editable .star-slot{cursor:pointer;}
.star-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold-solid);}
.ach-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(var(--acc),.12),rgba(var(--pri-rgb),.08));border:1px solid rgba(var(--acc),.25);border-radius:12px;padding:12px;cursor:pointer;transition:background .15s;}
.ach-card:hover{background:linear-gradient(135deg,rgba(var(--acc),.18),rgba(var(--pri-rgb),.12));}
.ach-info{flex:1;min-width:0;}
.ach-title{font-size:13px;font-weight:700;color:var(--txt-hi);}
.ach-count{font-size:11px;color:var(--accent);font-weight:600;margin-top:1px;margin-bottom:6px;}
.ach-bar-wrap{height:8px;background:rgba(var(--ink),.08);border-radius:4px;overflow:hidden;}
.ach-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-solid),var(--ok-solid));border-radius:4px;}
.ach-arrow{font-size:20px;color:var(--accent);flex-shrink:0;}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px 4px;}
/* Полиця жанрів: кожен рядок — книжка корінцем до нас. Колір корінця й
   заповнення беруться з GENRE_COLORS, тобто з даних, а не з теми. */
.gen-shelf{display:flex;flex-direction:column;gap:7px;}
.gen-row{position:relative;border-radius:11px;overflow:hidden;cursor:pointer;
  background:rgba(var(--ink),.05);border-left:4px solid transparent;transition:background .15s;}
.gen-row:hover{background:rgba(var(--ink),.09);}
.gen-row.done{background:rgba(var(--ok-rgb),.10);}
.gen-fill{position:absolute;top:0;bottom:0;left:0;opacity:.20;pointer-events:none;}
.gen-body{position:relative;display:flex;align-items:center;gap:9px;padding:9px 11px;}
.gen-em{font-size:16px;line-height:1;flex-shrink:0;}
.gen-name{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--txt-hi);line-height:1.2;}
.gen-name i{display:block;font-style:normal;font-size:10px;font-weight:500;color:var(--txt-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gen-cnt{font-size:11.5px;font-weight:700;color:var(--txt-2);font-variant-numeric:tabular-nums;flex-shrink:0;}
.gen-thumb{width:26px;height:37px;border-radius:4px;object-fit:cover;display:block;flex-shrink:0;}
.gen-lock{font-size:13px;opacity:.55;width:26px;text-align:center;flex-shrink:0;}

.ach-badge{display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center;padding:4px 2px;border-radius:10px;transition:background .15s;}
.ach-badge:hover{background:rgba(var(--ink),.06);}
.ach-badge-lbl{font-size:9px;font-weight:600;color:var(--txt);margin-top:4px;max-width:70px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.25;}
.ach-badge-tier{font-size:8px;color:var(--txt-4);margin-top:1px;}
.tier-caption{text-align:center;font-size:11px;color:var(--accent);font-weight:600;margin-bottom:8px;}
.tier-bar{display:flex;gap:3px;margin-bottom:6px;}
.tier-seg{flex:1;height:8px;background:rgba(var(--ink),.08);border-radius:4px;overflow:hidden;}
.tier-seg-fill{height:100%;background:var(--ok-solid);border-radius:4px;}
.tier-marks{display:flex;gap:3px;}
.ach-reward-box{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(var(--gold-rgb),.06);border:1px dashed rgba(var(--gold-rgb),.3);border-radius:10px;padding:10px;margin-top:12px;}
.ach-reward-box.unlocked{background:rgba(var(--ok-rgb),.1);border:1px solid rgba(var(--ok-rgb),.35);}
.ach-reward-lock{font-size:24px;opacity:.6;}
.ach-reward-lbl{font-size:10px;color:var(--txt-3);text-align:center;font-weight:600;}
.ach-reward-box.unlocked .ach-reward-lbl{color:var(--ok);}
.tier-mark{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tier-mark-icon{font-size:11px;}
.tier-mark-val{font-size:10px;color:var(--txt-3);font-weight:600;}
.tier-mark.reached .tier-mark-val{color:var(--txt-hi);}
.ach-back-btn{background:rgba(var(--acc),.1);border:1px solid rgba(var(--acc),.25);border-radius:20px;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:7px 14px;margin-bottom:8px;}
.modal-box.ach-modal{max-height:76vh;display:flex;flex-direction:column;overflow:hidden;}
/* Налаштування довгі, тому шапка тримається на місці, як в ачівках. */
.modal-box.ps-modal{max-height:84vh;display:flex;flex-direction:column;overflow:hidden;}
.ps-hdr{flex-shrink:0;padding:0 26px 10px 0;border-bottom:1px solid rgba(var(--ink),.08);margin-bottom:12px;}
.ps-body{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px 2px;}
.ach-modal-hdr{flex-shrink:0;padding-right:26px;}
.ach-grid-scroll{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px 4px;}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem;}
.modal-box{position:relative;background:var(--panel);border:1px solid rgba(var(--acc),.18);border-radius:20px;padding:1.5rem;max-width:340px;width:100%;max-height:88vh;overflow-y:auto;}
.goal-num-input::-webkit-inner-spin-button,.goal-num-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.goal-num-input{-moz-appearance:textfield;}
.modal-box.wide{max-width:400px;}
.m-img{width:130px;height:130px;image-rendering:pixelated;display:block;margin:0 auto 10px;}
.m-emoji{font-size:46px;text-align:center;margin-bottom:10px;}
.m-title{font-size:16px;font-weight:700;color:var(--txt-hi);margin-bottom:6px;text-align:center;}
.m-desc{font-size:12px;color:var(--txt-2);margin-bottom:1.25rem;text-align:center;line-height:1.6;}
.m-btns{display:flex;gap:8px;}
.btn-ok,.btn-cancel{font-size:14px;padding:13px 10px;border-radius:12px;font-weight:600;cursor:pointer;min-height:44px;}
.m-btns button{flex:1;}
.btn-ok{background:var(--pri);color:var(--pri-txt);border:none;}
.btn-ok:hover{background:var(--pri-hi);}
.btn-cancel{background:rgba(var(--ink),.08);color:var(--txt);border:1px solid rgba(var(--ink),.15);}
.btn-cancel:hover{background:rgba(var(--ink),.14);}
.flbl{font-size:10px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.form-section{background:rgba(var(--ink),.03);border:1px solid rgba(var(--ink),.06);border-radius:12px;padding:12px;margin-bottom:14px;}
.form-section-title{font-size:12px;font-weight:700;color:var(--txt-hi);margin-bottom:10px;}
.cover-preview-box{width:52px;height:74px;border-radius:8px;background:rgba(var(--ink),.06);border:1px dashed rgba(var(--ink),.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;}
.finput{width:100%;background:rgba(var(--ink),.07);border:1px solid rgba(var(--ink),.15);border-radius:10px;padding:9px 12px;color:var(--txt-hi);font-size:13px;outline:none;margin-bottom:10px;}
.finput:focus{border-color:var(--accent);}
select option{background:var(--panel);color:var(--txt-hi);}
.ppill{background:rgba(var(--acc),.15);color:var(--accent);font-size:12px;font-weight:600;padding:8px;border-radius:10px;text-align:center;margin-bottom:10px;}
.sp-error{background:rgba(var(--bad-rgb),.14);border:1px solid rgba(var(--bad-rgb),.35);color:var(--bad);font-size:12px;font-weight:600;padding:9px 12px;border-radius:10px;text-align:center;margin-bottom:10px;}
.bd-hero{position:relative;margin:-1.5rem -1.5rem 14px;padding:26px 1.5rem 14px;display:flex;justify-content:center;overflow:hidden;}
.bd-hero-bg{position:absolute;inset:-25%;background-size:cover;background-position:center;filter:blur(30px) saturate(150%) brightness(.65);transform:scale(1.15);}
.bd-hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--panel-rgb),0) 45%,var(--panel) 100%);}
.bd-cover-tap{position:relative;cursor:pointer;z-index:1;}
.bd-delete-btn{display:block;margin:6px auto 0;width:34px;height:34px;border-radius:50%;background:rgba(var(--ink),.06);border:1px solid rgba(var(--ink),.12);color:var(--txt-3);font-size:14px;cursor:pointer;}
.bd-delete-btn:hover{background:rgba(var(--bad-rgb),.15);color:var(--bad);border-color:rgba(var(--bad-rgb),.3);}
/* padding лише ЗВЕРХУ: знизу ті 14 px лежали під останньою полицею й
   виглядали як чорна смуга під шафою. overflow:hidden — щоб полиця не
   виступала квадратними кутами за круглий край шафи. */
.shelf-wrap{width:100%;display:flex;flex-direction:column;gap:16px;background:var(--shelf);border-radius:10px;padding:14px 0 0;overflow:hidden;}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;}

/* Шапка бібліотеки приклеєна до верху разом з контролями вигляду.
   Від'ємні відступи й top:-10px гасять padding .main-content, інакше над
   шапкою лишається просвіт, у який видно контент, що проїжджає. */
.lib-top{position:sticky;top:-10px;z-index:6;margin:-10px -10px 12px;padding:10px 10px 0;background:var(--app);}
.lib-hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;}
.lib-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600;}
.lib-gear{background:none;border:none;cursor:pointer;font-size:18px;color:var(--accent);padding:4px;font-family:inherit;line-height:1;}
.lib-top::after{content:'';display:block;height:1px;background:rgba(var(--ink),.07);margin:0 -10px;}

/* ПОДОРОЖ — бібліотека доріжкою.
   Геометрія рахується в JS одним кроком (PITCH), а доріжка малюється SVG
   з viewBox "0 0 100 H": x у ньому — це відсотки ширини, y — пікселі 1:1.
   Тому CSS-координати карточок і вузлів збігаються з кривою без жодного
   перерахунку. Обводка не тягнеться разом з розтягуванням по x завдяки
   vector-effect="non-scaling-stroke", а кружечки — це HTML, а не SVG, щоб
   не перетворились в еліпси. */
.jn-wrap{position:relative;}
.jn-road{position:absolute;left:0;top:0;width:100%;pointer-events:none;}
.jn-node{position:absolute;width:19px;height:19px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--app);box-shadow:0 0 0 1px rgba(var(--ink),.22);}
.jn-link{position:absolute;height:0;border-top:2px dotted rgba(var(--ink),.28);transform:translateY(-1px);}
.jn-card{position:absolute;transform:translateY(-50%);display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:13px;cursor:pointer;overflow:hidden;}
.jn-cover{width:37px;height:53px;border-radius:4px;object-fit:cover;flex-shrink:0;}
.jn-cover-ph{width:37px;height:53px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;}
.jn-info{min-width:0;flex:1;}
.jn-title{font-size:12.5px;font-weight:700;color:var(--txt-hi);line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.jn-author{font-size:11px;color:var(--txt-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* Зірки виносимо під текст окремим рядком — той самий компонент, що в картці
   книги (з половинками), тільки дрібніший і вирівняний по лівому краю. */
.jn-stars{margin-top:4px;}
.jn-stars .star-rating{justify-content:flex-start;gap:1px;}
.jn-stars .star-slot{font-size:13px;}
.jn-pill{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;}
.jn-flag{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:19px;line-height:1;}
/* ЖАНРИ — вертикальний стовп, від кожного жанру своя кольорова доріжка.
   Доріжка не тікає за екран: після п'ятої книги вона розвертається вниз і
   йде назад, тому жанр з дванадцятьма книгами — це просто вищий блок, а не
   нескінченна смуга вбік. Скрол лишається один, вертикальний. */
.gn-wrap{position:relative;padding-left:30px;}
.gn-trunk{position:absolute;left:13px;top:6px;bottom:6px;width:3px;border-radius:2px;background:rgba(var(--ink),.16);}
.gn-block{position:relative;}
.gn-hdr{display:flex;align-items:center;gap:7px;margin-bottom:2px;}
.gn-dot{position:absolute;left:-21px;top:1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--app);}
/* ніжка від смуги до обкладинки — вертикальний пунктир */
.gn-stem{position:absolute;width:0;height:16px;border-left:2px dotted rgba(var(--ink),.28);}
.gn-name{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:11px;color:#14141c;white-space:nowrap;}
.gn-count{font-size:10px;font-weight:700;color:var(--txt-3);}
.gn-empty{font-size:10px;color:var(--txt-4);font-style:italic;}
.gn-road{position:absolute;left:0;top:0;width:100%;pointer-events:none;}
.gn-book{position:absolute;transform:translateX(-50%);cursor:pointer;}
.gn-cover{display:block;width:42px;height:60px;border-radius:4px;object-fit:cover;box-shadow:0 3px 9px rgba(var(--shadow),.35);}
.gn-cover-ph{display:flex;align-items:center;justify-content:center;width:42px;height:60px;border-radius:4px;font-size:8.5px;font-weight:700;line-height:1.15;text-align:center;padding:3px;overflow:hidden;overflow-wrap:anywhere;hyphens:auto;color:rgba(255,255,255,.82);box-shadow:0 3px 9px rgba(var(--shadow),.35);}
.gn-star{font-size:9px;font-weight:700;color:var(--gold);text-align:center;margin-top:2px;}
/* наліпка «прочитано разом» — на кутку обкладинки, бо саме там її шукають */
.gn-q{position:absolute;top:-6px;right:-7px;font-size:13px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.jn-years{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;}
.jn-years::-webkit-scrollbar{display:none;}
.jn-year{flex:0 0 auto;font-size:11px;font-weight:700;padding:5px 12px;border-radius:14px;border:1px solid rgba(var(--ink),.14);background:rgba(var(--ink),.04);color:var(--txt-3);cursor:pointer;font-family:inherit;}
.jn-year.act{background:rgba(var(--gold-rgb),.16);border-color:rgba(var(--gold-rgb),.45);color:var(--gold);}
.wall-tile{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px rgba(var(--shadow),.4);}
.wall-tile-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:5px;text-align:center;font-size:9px;font-weight:700;color:rgba(255,255,255,.75);overflow:hidden;}
.wall-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.shelf-row{display:flex;flex-direction:column;}
.shelf-label{font-size:9px;color:var(--shelf-lbl);padding:0 10px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
.shelf-books{display:flex;align-items:flex-end;gap:5px;padding:16px 10px 0;height:192px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scrollbar-width:thin;scrollbar-color:rgba(var(--ink),.15) transparent;}
.shelf-books.compact{height:165px;}
.shelf-books::-webkit-scrollbar{height:3px;}.shelf-books::-webkit-scrollbar-track{background:transparent;}.shelf-books::-webkit-scrollbar-thumb{background:rgba(var(--ink),.15);border-radius:2px;}
.shelf-plank{width:100%;height:13px;background:linear-gradient(180deg,var(--plank-1) 0%,var(--plank-2) 35%,var(--plank-3) 100%);box-shadow:0 6px 16px rgba(var(--shadow),.7),inset 0 2px 0 rgba(255,255,255,.07);border-top:2px solid var(--plank-edge);flex-shrink:0;margin-top:0;}
.book-wrap{position:relative;display:flex;flex-direction:row;flex-shrink:0;cursor:pointer;transition:transform .18s;}
.book-wrap:hover{transform:translateY(-14px);z-index:20;}
.book-cover{position:relative;overflow:hidden;flex-shrink:0;border-radius:4px;}
.book-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.book-cover-inner{position:absolute;inset:0;}

/* EVO DOTS */
.evo-dots{display:flex;gap:2px;justify-content:center;margin-top:3px;}
.evo-dot{width:5px;height:5px;border-radius:50%;background:rgba(var(--ink),.2);}
.evo-dot.filled{background:var(--accent);}

/* SHOP ROW */
.shop-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(var(--ink),.06);}
.sh-emoji{font-size:20px;flex-shrink:0;}
.sh-info{flex:1;}
.sh-name{font-size:12px;font-weight:600;color:var(--txt-hi);}
.sh-desc{font-size:10px;color:var(--txt-3);margin-top:1px;}
.sh-price{font-size:11px;font-weight:600;color:var(--gold);}
.sh-btn{font-size:11px;padding:5px 12px;border-radius:8px;background:rgba(var(--ink),.1);border:1px solid rgba(var(--ink),.18);color:var(--txt-hi);cursor:pointer;margin-top:4px;display:block;}
.sh-btn:disabled{opacity:.3;cursor:not-allowed;}
.sh-btn:not(:disabled):hover{background:rgba(var(--ink),.2);}

/* SIDE PANEL */
#side-panel{position:fixed;top:0;right:-380px;width:350px;max-width:88vw;height:100vh;height:100dvh;background:var(--panel);border-left:1px solid rgba(var(--acc),.15);z-index:400;transition:right .25s;padding:1rem;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
#side-panel.open{right:0;}
#side-ov{position:fixed;inset:0;z-index:399;display:none;background:var(--scrim-2);}
#side-ov.open{display:block;}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(var(--acc),.3);color:var(--accent);padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:700;white-space:nowrap;}
.toast.show{opacity:1;}
.loc-toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--pop);border:1px solid rgba(var(--acc),.4);color:var(--txt-hi);padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:700;white-space:nowrap;box-shadow:0 4px 16px rgba(var(--shadow),.5);}
.loc-toast.show{opacity:1;}
.loc-toast small{display:block;font-size:11px;font-weight:600;color:var(--accent);margin-top:3px;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(var(--ink),.15);border-radius:2px;}

/* рядок з мініатюрами тем у налаштуваннях */
.wall-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.wall-more{width:100%;margin-top:9px;padding:9px;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:600;color:var(--txt-3);
  background:rgba(var(--ink),.04);border:1px dashed rgba(var(--ink),.16);}
.wall-more:hover{color:var(--accent);border-color:var(--accent);}
/* Прев'ю на весь екран. contain, а не cover: сенс саме в тому, щоб
   побачити арт цілим, а не обрізаним по краях. */
.wall-fs{position:fixed;inset:0;z-index:600;background:var(--scrim);display:flex;flex-direction:column;}
.wall-fs-img{flex:1;min-height:0;background-size:contain;background-position:center;background-repeat:no-repeat;}
.wall-fs-bar{flex-shrink:0;display:flex;align-items:center;gap:9px;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom, 0px));background:var(--glass);}
.wall-fs-nm{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--txt-hi);}
.wall-fs-nm i{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:var(--txt-3);}
.wall-fs-arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
  border:none;cursor:pointer;font-family:inherit;font-size:24px;line-height:1;
  background:var(--glass);color:var(--txt-hi);opacity:.75;
}
.wall-fs-arrow:hover{opacity:1;}
.wall-fs-arrow.l{left:10px;}
.wall-fs-arrow.r{right:10px;}
.wall-fs-cur{font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap;}
.wall-fs .btn-ok,.wall-fs .btn-cancel{flex-shrink:0;padding:9px 14px;font-size:13px;width:auto;}
.wall-item{display:flex;flex-direction:column;gap:4px;}
.wall-card{position:relative;aspect-ratio:9/14;border-radius:9px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(var(--ink),.14);background:rgba(var(--ink),.05);}
.wall-card img{width:100%;height:100%;object-fit:cover;display:block;}
.wall-card.act{border-color:var(--accent);box-shadow:0 0 0 2px rgba(var(--acc),.3);}
/* Закриті обої НЕ показують картинку: розкриття лишається на момент
   нагороди. Видно тільки замок і звідки арт прийде. */
.wall-card.lk{cursor:default;border-style:dashed;background:rgba(var(--ink),.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.wall-lock{font-size:14px;line-height:1;opacity:.65;}
.wall-req{font-size:7.5px;font-weight:600;color:var(--txt-3);text-align:center;line-height:1.2;padding:0 2px;}
.wall-cap{font-size:8.5px;font-weight:600;color:var(--txt-3);text-align:center;line-height:1.2;}
.wall-cap.act{color:var(--accent);}
/* Широка обрізка арту для модалки «Нові обої» — портрет у 130px нікуди
   не влазить, тому беремо смугу з верхньої третини. */
.wall-hero{width:100%;aspect-ratio:16/10;border-radius:12px;margin-bottom:12px;
  background-size:cover;background-position:center 32%;}
.theme-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:thin;scrollbar-color:rgba(var(--ink),.15) transparent;}
.theme-row::-webkit-scrollbar{height:3px;}
.theme-row::-webkit-scrollbar-thumb{background:rgba(var(--ink),.15);border-radius:2px;}
</style>
<script>
/* Тема ставиться до першого малювання, окремим скриптом у <head>: основний
   скрипт іде після <body>, і сторінка встигла б блимнути темною перед
   світлою. Формат — той самий JSON, що пише lsSet. */
try{var _t=localStorage.getItem('rw_theme');if(_t){_t=JSON.parse(_t);if(_t&&_t!=='night')document.documentElement.setAttribute('data-theme',_t);}}catch(e){}
</script>
</head>
<body>
<div class="app">

<!-- LOGIN -->
<div id="screen-select" class="screen active">
  <div class="sel-bg">
    <div class="sel-title">Читальний Світ</div>
    <div class="login-box" id="login-box">
      <div id="login-body"></div>
      <div class="disclaimer">Некомерційний фанатський проєкт. Pokémon © Nintendo / Creatures Inc. / GAME FREAK inc.</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="screen-main" class="screen">
  <div class="hdr">
    <div class="hdr-av" id="hdr-av" onclick="openProfileSettings()" style="cursor:pointer"></div>
    <div class="hdr-info">
      <div class="hdr-name" id="hdr-name"></div>
      <div class="hdr-loc" id="hdr-loc"></div>
    </div>
    <div class="hdr-res">
      <span id="save-status" style="font-size:11px;font-weight:700;visibility:hidden;display:inline-block;width:14px;text-align:center;flex-shrink:0"></span>
      <div class="rpill" id="hdr-coins" title="Монети — трать у Магазині">🪙0</div>
      <div class="rpill rpill-menu" onclick="openSidePanel()" title="Книжкові бали — трать на лов. Тапни, щоб додати книгу">➕📙<span id="hdr-bookpoints">0</span></div>
    </div>
  </div>
  <div class="main-content">
    <div class="tab-page" id="tab-map">
      <div class="sec-title"><span>Колекція</span><span id="dex-count" title="🐣 Спіймано видів · 🐉 Мега-еволюцій" style="font-weight:600;color:var(--txt);font-size:15px;text-transform:none;letter-spacing:0"></span></div>
      <div class="dex-grid" id="dex-grid"></div>
      <div id="dex-complete"></div>
      <div class="map-card"><div id="map-region-tabs"></div><svg id="map-svg" class="map-svg" viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="mapBg" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#162032"/>
            <stop offset="100%" stop-color="#070e1a"/>
          </radialGradient>
        </defs>
        <rect id="map-bg" width="460" height="240" fill="url(#mapBg)" style="display:none"/>
        <image id="map-png" href="map1.webp" x="0" y="0" width="460" height="240" preserveAspectRatio="xMidYMid slice"
          onerror="this.setAttribute('href','map1.jpg')"/>
        <g id="map-edges"></g><g id="map-nodes"></g><g id="map-markers"></g>
      </svg></div>
      <div class="act-card">
        <div class="act-list" id="act-list"></div>
      </div>
    </div>
    <div class="tab-page" id="tab-library" style="display:none">
      <div id="library-fullscreen"></div>
    </div>
    <div class="tab-page" id="tab-friends" style="display:none">
      <div class="sec-title"><span>Друзі</span></div>

    </div>
    <div class="tab-page" id="tab-stats" style="display:none">
      <div class="sec-title"><span>Статистика</span></div>
      <div class="stats-sub-hdr">Мета</div>
      <div id="goal-widget"></div>
      <div class="stats-divider"></div>
      <div class="stats-sub-hdr">Загальна статистика</div>
      <div id="general-stats-widget"></div>
      <div class="stats-divider"></div>
      <div class="stats-sub-hdr">Досягнення</div>
      <div id="achievements-widget"></div>
      <div class="stats-divider"></div>
      <div class="stats-sub-hdr">Рік у книгах</div>
      <div id="year-wrap-widget"></div>
    </div>
  </div>
  <div class="guest-bar" id="guest-bar">
    <div class="guest-bar-txt">⚠️ Гість — прогрес лише на цьому пристрої</div>
    <button class="guest-bar-btn" onclick="openClaim()">Стати читачем →</button>
  </div>
  <div class="bottom-tabs">
    <button class="bottom-tab act" id="bt-map" onclick="setMainTab('map')"><span class="bt-icon">🗺️</span>Мапа</button>
    <button class="bottom-tab" id="bt-library" onclick="setMainTab('library')"><span class="bt-icon">📚</span>Бібліотека</button>
    <button class="bottom-tab" id="bt-stats" onclick="setMainTab('stats')"><span class="bt-icon">📊</span>Статистика</button>
    <button class="bottom-tab" id="bt-friends" onclick="setMainTab('friends')"><span class="bt-icon">👥</span>Друзі<span class="tab-badge" id="fr-badge" style="display:none"></span></button>
  </div>
</div>
</div>

<div id="side-ov" onclick="closeSidePanel()"></div>
<div id="side-panel">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
    <span style="font-size:14px;font-weight:700;color:var(--txt-hi)">Додати книгу</span>
    <button onclick="closeSidePanel()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--accent)">✕</button>
  </div>
  <div id="side-content" style="flex:1"></div>
  <div style="padding-top:1rem;margin-top:1rem;border-top:1px solid rgba(var(--ink),.07)">
    <button onclick="closeSidePanel();saveToCloud(cur)" style="width:100%;padding:12px;background:rgba(var(--ok-rgb),.15);border:1px solid rgba(var(--ok-rgb),.25);border-radius:10px;color:var(--ok);font-size:13px;font-weight:600;cursor:pointer">💾 Зберегти прогрес</button>
  </div>

<div class="toast" id="toast"></div>
<div class="loc-toast" id="loc-toast"></div>

<script>
// ═══════════ PLAYERS ═══════════
// Раніше тут був хардкод трьох дітей. Тепер гравець — той, хто увійшов:
// PLAYERS містить рівно один елемент (я). Друзі додадуться на етапі 4,
// і код, який ходить по PLAYERS (пінси на мапі, спільна статистика),

function chainsForLoc(locId){return CHAINS.filter(c=>c.loc===locId);}
function stagePrice(chain,idx){
  const st=chain.stages[idx];
  if(chain.stages.length===1) return 10;
  if(st.mega) return 20;
  return idx===0?5:idx===1?7:10;
}
function nextStageIdx(d,chain){const idx=d.progress[chain.id];return idx===undefined?0:idx+1;}
function catchableStages(locId){
  const d=pd();const out=[];
  chainsForLoc(locId).forEach(chain=>{
    const idx=nextStageIdx(d,chain);
    if(idx>=chain.stages.length)return;
    const weight=chain.stages[idx].mega?1:3;
    for(let i=0;i<weight;i++) out.push({chain,idx});
  });
  return out;
}
function locHasMega(d,locId){
  return chainsForLoc(locId).some(chain=>{
    const idx=d.progress[chain.id];
    return idx!==undefined && chain.stages[idx].mega;
  });
}
function caughtCountIn(d,locIds){
  let n=0;
  locIds.forEach(l=>chainsForLoc(l).forEach(c=>{if(d.progress[c.id]!==undefined)n++;}));
  return n;
}
function megasCaughtIn(d,locIds){
  let n=0;
  locIds.forEach(l=>chainsForLoc(l).forEach(c=>{const idx=d.progress[c.id];if(idx!==undefined&&c.stages[idx].mega)n++;}));
  return n;
}
function touchProgressOrder(d,chainId){
  if(!d.progressOrder)d.progressOrder=[];
  const i=d.progressOrder.indexOf(chainId);
  if(i>=0)d.progressOrder.splice(i,1);
  d.progressOrder.push(chainId);
}
function isLocComplete(locId){
  const d=pd();const chains=chainsForLoc(locId);
  if(!chains.length)return false;
  return chains.every(c=>d.progress[c.id]===c.stages.length-1);
}

function reqMet(d,req){
  if(!req)return true;
  if(req.type==='keyChain') return d.progress[req.chainId]!==undefined && d.progress[req.chainId]>=req.stageIdx;
  if(req.type==='locMega') return locHasMega(d,req.loc);
  if(req.type==='count') return caughtCountIn(d,req.locs)>=req.need;
  if(req.type==='megaCount') return megasCaughtIn(d,req.locs)>=req.need;
  return false;
}
function unlockHintText(loc){
  const req=loc.unlockReq;if(!req)return'';
  const d=pd();
  if(req.type==='keyChain'){
    const chain=CHAINS.find(c=>c.id===req.chainId);const stage=chain.stages[req.stageIdx];
    const cur=d.progress[req.chainId];
    const seq=chain.stages.map((s,i)=>{
      if(i===req.stageIdx)return`<b style="color:var(--gold)">${s.name}</b>`;
      if(cur!==undefined&&i<=cur)return`${s.name} ✓`;
      return s.name;
    }).join(' → ');
    const srcLoc=LOCS[chain.loc];
    return`Потрібен ключовий покемон: <b>${stage.name}</b>.<br><span style="font-size:11px;opacity:.85">${seq}</span><br>Злови його в «${srcLoc?srcLoc.name:''}» або докупи в 🛒 Магазині.`;
  }
  if(req.type==='locMega'){
    const locName=LOCS[req.loc]?.name||req.loc;
    return`Потрібна будь-яка Мега-еволюція 🐉 з локації <b>${locName}</b>.`;
  }
  if(req.type==='count'){
    const have=caughtCountIn(d,req.locs);
    return`Потрібно зловити ${req.need} видів покемонів<br>(зараз: ${have} / ${req.need}).`;
  }
  if(req.type==='megaCount'){
    const have=megasCaughtIn(d,req.locs);
    return`Потрібно ${req.need} Мега-еволюцій 🐉<br>(зараз: ${have} / ${req.need}).`;
  }
  return'';
}

// ═══════════ СПРАЙТИ ПОКЕМОНІВ ═══════════
// Картинки лежать на raw.githubusercontent.com і віддаються з
// `Cache-Control: max-age=300` — через п'ять хвилин браузер тягне всі 98
// заново. На мобільному це і є «довго грузиться», а кожен зірваний запит
// показувався літерою замість покемона.
//
// Тому перший раз забираємо їх СОБІ: data:URI в localStorage. Спрайт важить
// ~600 байт, тобто вся колекція — десятки кілобайт. Далі екран колекції
// відкривається без жодного запиту й працює офлайн.
const SPR_KEY='rw_spr_';
const SPR_WARM_PAR=4;              // скільком дозволяємо їхати водночас
let _sprMem={},_sprBusy=0,_sprQueue=[],_sprOff=false;
function sprUrl(pid){return`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pid}.png`;}
function sprCached(pid){
  if(_sprMem[pid]!==undefined)return _sprMem[pid];
  let v=null;
  try{v=localStorage.getItem(SPR_KEY+pid);}catch(e){}
  _sprMem[pid]=v;
  return v;
}
// Викидає всі закешовані спрайти — місце під сейв важливіше за картинки.
function sprDrop(){
  const kill=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf(SPR_KEY)===0)kill.push(k);
    }
    kill.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  _sprMem={};_sprQueue=[];
  return kill.length;
}
// Сейв мусить лягти навіть тоді, коли місця не стало.
function saveLocal(key,json){
  try{localStorage.setItem(key,json);return true;}
  catch(e){
    const n=sprDrop();
    _sprOff=true;                 // до перезавантаження більше не кешуємо
    try{localStorage.setItem(key,json);
      console.warn('[LS] місце скінчилось, викинуто спрайтів: '+n);
      return true;}
    catch(e2){
      console.error('[LS] сейв не влазить у localStorage',e2);
      showToast('Не вдалося зберегти на пристрої — звільни місце в браузері');
      return false;
    }
  }
}
function sprStore(pid,uri){
  _sprMem[pid]=uri;
  if(_sprOff)return;
  // Місце в localStorage спільне зі сейвом, тому при переповненні просто
  // перестаємо кешувати — гра від цього не ламається, лише знову ходить
  // у мережу.
  try{localStorage.setItem(SPR_KEY+pid,uri);}catch(e){_sprOff=true;}
}
function img(pid){return sprCached(pid)||sprUrl(pid);}
// Дотягуємо те, чого ще немає, ПІСЛЯ того, як екран намалювався: браузер уже
// взяв ці ж файли для <img>, тому fetch майже завжди влучає в його кеш і
// нової мережі не створює.
function sprWarm(pids){
  if(_sprOff)return;
  pids.forEach(pid=>{
    if(pid==null||sprCached(pid)||_sprQueue.indexOf(pid)>=0)return;
    _sprQueue.push(pid);
  });
  _sprPump();
}
function _sprPump(){
  while(_sprBusy<SPR_WARM_PAR&&_sprQueue.length){
    const pid=_sprQueue.shift();
    _sprBusy++;
    fetch(sprUrl(pid)).then(r=>r.ok?r.blob():null).then(b=>{
      if(!b)return null;
      return new Promise(res=>{
        const fr=new FileReader();
        fr.onload=()=>res(String(fr.result||''));
        fr.onerror=()=>res(null);
        fr.readAsDataURL(b);
      });
    }).then(uri=>{
      if(uri&&uri.indexOf('data:image')===0)sprStore(pid,uri);
    }).catch(()=>{}).then(()=>{_sprBusy--;_sprPump();});
  }
}
// Зірваний запит більше не стає літерою: пробуємо ще раз, і лише потім
// показуємо назву.
function sprFail(el){
  if(!el)return;
  if(!el.dataset.retried){
    el.dataset.retried='1';
    el.src=sprUrl(el.dataset.pid)+'?r='+Date.now();
    return;
  }
  if(el.dataset.ph==='hide'){el.style.display='none';return;}
  const ph=document.createElement('div');
  ph.className=(el.className||'')+' spr-ph';
  ph.textContent=el.dataset.name||'?';
  el.replaceWith(ph);
}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function coinsForPages(p){return Math.floor(p/100)+1;}

// Назви місяців у трьох формах, по одному примірнику на кожну: повна —
// для «Найпродуктивніший місяць» (і у своєму підсумку, і в підсумку друга),
// коротка — під стовпчиками графіка, родова (UA_MONTHS, нижче) — для дат.
const UA_MONTHS_FULL=['Січень','Лютий','Березень','Квітень','Травень','Червень',
                      'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const UA_MONTHS_SHORT=['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
function pluralUA(n,one,few,many){
  const n10=n%10,n100=n%100;
  if(n100>=11&&n100<=14)return many;
  if(n10===1)return one;
  if(n10>=2&&n10<=4)return few;
  return many;
}
// Назва й автор книги йдуть у HTML через шаблонні рядки в десятку місць
// (полиця, деталі, "рік у книгах"). Дані приходять з Goodreads, а їх там
// правлять сторонні люди — тобто назва книги це чужий текст. Чистимо його
// ОДИН раз при потраплянні в стан, а не в кожному місці рендеру: символи,
// якими відкривається тег або вихід із атрибута, у назвах книг не бувають.
function cleanBookText(s){
  return String(s||'').replace(/[<>"'`\\]/g,'').trim().slice(0,300);
}
// Обкладинка підставляється в src=""/url() — приймаємо лише звичайні https-адреси.
function cleanCoverUrl(u){
  u=String(u||'').trim();
  if(!u)return null;
  if(!/^https:\/\/[^\s"'<>()\\]+$/i.test(u))return null;
  return u;
}

function bookWord(n){return pluralUA(n,'книга','книги','книг');}
function bookPeriodKeys(book){
  let dt;
  if(book.ts){dt=new Date(book.ts);}
  else{
    const m=(book.date||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if(!m)return{month:null,year:null};
    dt=new Date(+m[3],+m[2]-1,+m[1]);
  }
  return{month:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'),year:String(dt.getFullYear())};
}
function booksInMonth(d,monthKey){return(d.books||[]).filter(b=>bookPeriodKeys(b).month===monthKey).length;}
function booksInYear(d,yearKey){return(d.books||[]).filter(b=>bookPeriodKeys(b).year===yearKey).length;}
function booksForPeriod(d,period){
  const books=d.books||[];
  if(period==='all')return books;
  const key=period==='month'?curMonthKey():curYearKey();
  return books.filter(b=>bookPeriodKeys(b)[period]===key);
}
function statsForPeriod(d,period){
  const filtered=booksForPeriod(d,period);
  return{books:filtered.length,pages:filtered.reduce((s,b)=>s+(b.pages||0),0)};
}
// Best-effort language guess from the book TITLE only (no full text available):
// Cyrillic titles are split into Ukrainian/Russian via letters unique to each
// alphabet (і/ї/є/ґ vs ы/э/ъ); Latin titles are matched against a few common
// diacritic sets, defaulting to English when nothing distinctive is found.
const GENRES=['Фентезі','Пригоди','Наукова фантастика','Детектив','Дитяча','Історичне','Жахи / Містика','Реалізм','Нонфікшн','Комікс / Манга','Романтика','Класика','Антиутопія','Трилер','Інше'];
// Як саме книгу прочитали. Кольори тут — дані, як у жанрів, тому під
// тему не підпадають. Старі книги формату не мають: показуємо їх окремо
// («Не вказано»), а не приписуємо їм електронну заднім числом.
const FORMATS=[
  {id:'ebook', label:'Електронна', emoji:'📱', color:'#38bdf8'},
  {id:'paper', label:'Паперова',   emoji:'📕', color:'#f59e0b'},
  {id:'audio', label:'Аудіо',      emoji:'🎧', color:'#a78bfa'},
];
const DEFAULT_FORMAT='ebook';
function formatById(id){return FORMATS.find(x=>x.id===id)||null;}
function formatLabel(b){const x=formatById(b&&b.format);return x?x.emoji+' '+x.label:'';}
const GENRE_COLORS={
  'Фентезі':'#a78bfa','Пригоди':'#fb923c','Наукова фантастика':'#38bdf8','Детектив':'#818cf8',
  'Дитяча':'#facc15','Історичне':'#fbbf24',
  'Жахи / Містика':'#f87171','Реалізм':'#2dd4bf','Нонфікшн':'#22d3ee','Комікс / Манга':'#e879f9',
  'Романтика':'#c084fc','Класика':'#60a5fa','Антиутопія':'#34d399','Трилер':'#4ade80','Інше':'#9ca3af',
};
const LANG_META={
  uk:{label:'Українська',color:'#60a5fa'},
  ru:{label:'Оркська',color:'#4d7c3a'},
  en:{label:'English',color:'#f87171'},
  ro:{label:'Румунська',color:'#c084fc'},
  pl:{label:'Польська',color:'#fb923c'},
  de:{label:'Німецька',color:'#facc15'},
  fr:{label:'Французька',color:'#22d3ee'},
  es:{label:'Іспанська',color:'#a3e635'},
};
function detectBookLanguage(title){
  title=title||'';
  if(/[Ѐ-ӿ]/.test(title)){
    if(/[іїєґІЇЄҐ]/.test(title))return'uk';
    if(/[ыэъЫЭЪ]/.test(title))return'ru';
    if(/(^|\s)[иИ](\s|$)/.test(title))return'ru'; // standalone "и" = Russian "and"
    if(/(^|\s)[йЙ](\s|$)/.test(title))return'uk'; // standalone "й" = Ukrainian "and"
    return'uk';
  }
  if(/[ăâîșțşţĂÂÎȘȚŞŢ]/.test(title))return'ro';
  if(/[ąćęłńśżźĄĆĘŁŃŚŻŹ]/.test(title))return'pl';
  if(/[äöüßÄÖÜ]/.test(title))return'de';
  if(/[àâçéèêëîïôùûÿœÀÂÇÉÈÊË]/.test(title))return'fr';
  if(/[áíñóúü¿¡ÁÍÑÓÚÜ]/.test(title))return'es';
  return'en';
}
function langBreakdown(books){
  const counts={};
  books.forEach(b=>{const l=detectBookLanguage(b.title);counts[l]=(counts[l]||0)+1;});
  return Object.entries(counts).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1])
    .map(([lang,count])=>({lang,count,...LANG_META[lang]}));
}
function monthlyBreakdown(d,yearKey){
  const arr=Array.from({length:12},()=>({books:0,pages:0,ratingSum:0,ratingCount:0}));
  (d.books||[]).forEach(b=>{
    const pk=bookPeriodKeys(b);
    if(pk.year!==yearKey||!pk.month)return;
    const idx=parseInt(pk.month.split('-')[1],10)-1;
    arr[idx].books++;arr[idx].pages+=b.pages||0;
    if(b.rating){arr[idx].ratingSum+=b.rating;arr[idx].ratingCount++;}
  });
  return arr.map(m=>({...m,rating:m.ratingCount?Math.round((m.ratingSum/m.ratingCount)*10)/10:0}));
}
function availableStatsYears(d){
  const set=new Set((d.books||[]).map(b=>bookPeriodKeys(b).year).filter(Boolean));
  set.add(curYearKey());
  return Array.from(set).sort((a,b)=>b-a);
}
function monthlyGoalReward(target,achieved){return achieved>=target?target:0;}
function yearlyGoalReward(target,achieved){
  const pct=achieved/target;
  if(pct>=1)return target;
  if(pct>=0.75)return Math.floor(target*0.70);
  if(pct>=0.50)return Math.floor(target*0.40);
  return 0;
}

// Evaluates any past-due goal (month/year rolled over since it was set) and queues the
// result popup + reward, then queues a "set a new goal" prompt if none is active yet
// for the current period and the player hasn't dismissed it already this period.
function checkGoalEvents(){
  const d=pd();
  const mKey=curMonthKey(),yKey=curYearKey();

  if(d.monthlyGoal&&!d.monthlyGoal.resolved&&d.monthlyGoal.periodKey!==mKey){
    const g=d.monthlyGoal;
    const achieved=booksInMonth(d,g.periodKey);
    const reward=monthlyGoalReward(g.target,achieved);
    d.coins=(d.coins||0)+reward;
    g.resolved=true;
    const beforeAch=fullyCompletedKeys(d);
    d.currentGoalStreak=achieved>=g.target?(d.currentGoalStreak||0)+1:0;
    d.bestGoalStreak=Math.max(d.bestGoalStreak||0,d.currentGoalStreak);
    celebrateNewAchievements(d,beforeAch);
    if(reward>0){
      qM(()=>mHTML(`${M_CLOSE_BTN}<div class="m-emoji">🎉</div><div class="m-title">Ціль на місяць виконано!</div><div class="m-desc">Ціль була <b>${g.target}</b> ${bookWord(g.target)}, а вийшло <b>${achieved}</b> — тобі <b>+${reward}🪙</b>!</div><div class="m-btns"><button class="btn-ok" onclick="closeModal()">Ура!</button></div>`));
    } else {
      qM(()=>mEmoji('📖','Ціль на місяць не досягнута',`Прогрес: ${achieved}/${g.target} ${bookWord(g.target)}.\nСпробуй ще наступного разу!`,[{l:'Ок',ok:true,cb:closeModal}]));
    }
    renderRes();saveToCloud(cur);
  }

  if(d.yearlyGoal&&!d.yearlyGoal.resolved&&d.yearlyGoal.periodKey!==yKey){
    const g=d.yearlyGoal;
    const achieved=booksInYear(d,g.periodKey);
    const reward=yearlyGoalReward(g.target,achieved);
    d.coins=(d.coins||0)+reward;
    g.resolved=true;
    if(achieved>=g.target){
      qM(()=>mHTML(`${M_CLOSE_BTN}<div class="m-emoji">🏆</div><div class="m-title">Річну ціль виконано!</div><div class="m-desc">Ціль була <b>${g.target}</b> ${bookWord(g.target)} на рік, а вийшло <b>${achieved}</b> — тобі <b>+${reward}🪙</b>!</div><div class="m-btns"><button class="btn-ok" onclick="closeModal()">Ура!</button></div>`));
    } else if(reward>0){
      qM(()=>mHTML(`${M_CLOSE_BTN}<div class="m-emoji">🥈</div><div class="m-title">Майже вийшло!</div><div class="m-desc">Ціль була <b>${g.target}</b> ${bookWord(g.target)} на рік, прочитано <b>${achieved}</b>. За результат — <b>+${reward}🪙</b>!</div><div class="m-btns"><button class="btn-ok" onclick="closeModal()">Дякую!</button></div>`));
    } else {
      qM(()=>mEmoji('📖','Річну ціль не досягнуто',`Прогрес: ${achieved}/${g.target} ${bookWord(g.target)}.\nСпробуй ще наступного разу!`,[{l:'Ок',ok:true,cb:closeModal}]));
    }
    renderRes();saveToCloud(cur);
  }

  // Only the monthly goal gets an auto-popup, and only up through the 20th —
  // setting a target for the last ~10 days of the month is pointless. The yearly
  // goal is never auto-prompted; it's set manually via the "Задати ціль" button
  // in the stats widget instead.
  //
  // Питаємо ОДИН раз на місяць і тільки того, хто вже прочитав хоч одну книгу:
  //  • новому гравцеві ціль в лоб при створенні акаунта нічого не означає —
  //    він ще не бачив гри;
  //  • позначка ставиться в момент ПОКАЗУ, а не по натисканню ✕, інакше
  //    достатньо перезавантажити сторінку, щоб модалка вилізла знову.
  // Хто захоче поставити ціль сам — це завжди доступно в Статистиці → Мета.
  const goalPromptSeen=d.monthlyGoalPromptedFor===mKey||d.monthlyGoalDismissedFor===mKey;
  if((!d.monthlyGoal||d.monthlyGoal.periodKey!==mKey)&&!goalPromptSeen
     &&(d.booksRead||0)>0&&new Date().getDate()<=20){
    d.monthlyGoalPromptedFor=mKey;
    saveToCloud(cur);
    qM(()=>showSetGoalModal('month'));
  }
}

function showSetGoalModal(period){
  const isMonth=period==='month';
  const label=isMonth?'місяць':'рік';
  mHTML(`<button onclick="dismissGoalPrompt('${period}')" style="position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:var(--accent);line-height:1;padding:4px">✕</button>
    <div class="m-emoji">🎯</div>
    <div class="m-title">Постав ціль на ${label}</div>
    <div class="m-desc">Скільки книг плануєш прочитати? Виконаєш — отримаєш відповідну нагороду.</div>
    <input type="number" id="goal-input" class="finput goal-num-input" min="1">
    <button class="btn-ok" style="width:100%;padding:13px;font-size:14px;min-height:44px" onclick="setGoal('${period}')">Встановити</button>`);
}
function dismissGoalPrompt(period){
  const d=pd();
  if(period==='month')d.monthlyGoalDismissedFor=curMonthKey();
  else d.yearlyGoalDismissedFor=curYearKey();
  closeModal();saveToCloud(cur);
}
function setGoal(period){
  const val=parseInt(document.getElementById('goal-input').value);
  if(!val||val<1){showToast('Введи число більше 0');return;}
  const d=pd();
  if(period==='month'){d.monthlyGoal={target:val,periodKey:curMonthKey(),resolved:false};delete d.monthlyGoalDismissedFor;}
  else{d.yearlyGoal={target:val,periodKey:curYearKey(),resolved:false};delete d.yearlyGoalDismissedFor;}
  closeModal();renderActions();saveToCloud(cur);
  showToast('Ціль встановлено!');
}

function renderGoalWidget(){
  const el=document.getElementById('goal-widget');if(!el)return;
  const d=pd();
  const isMonth=_goalTab==='month';
  const key=isMonth?curMonthKey():curYearKey();
  const goal=isMonth?d.monthlyGoal:d.yearlyGoal;
  const active=!!(goal&&goal.periodKey===key);
  const target=active?goal.target:0;
  const achieved=active?(isMonth?booksInMonth(d,key):booksInYear(d,key)):0;
  const pct=active?Math.min(100,Math.round((achieved/target)*100)):0;
  const centerLabel=active?`${achieved}/${target}`:'0';
  const btnLabel=active?'Переглянути всі':'Задати ціль';
  const btnOnclick=active?'openGoalHistory()':`showSetGoalModal('${isMonth?'month':'year'}')`;

  const r=68,cx=100,cy=76,sw=13;
  const arcLen=Math.PI*r;
  const dashOffset=arcLen*(1-pct/100);
  const arcD=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;

  const tabs=`<div class="goal-tabs">
    <button class="goal-tab ${isMonth?'act':''}" onclick="setGoalTab('month')">На місяць</button>
    <button class="goal-tab ${!isMonth?'act':''}" onclick="setGoalTab('year')">На рік</button>
  </div>`;

  const gauge=`<div class="goal-gauge-wrap">
    <svg viewBox="0 0 200 96" class="goal-gauge-svg">
      <defs><linearGradient id="goalGaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#facc15"/><stop offset="100%" stop-color="#22c55e"/>
      </linearGradient></defs>
      <path d="${arcD}" fill="none" style="stroke:rgba(var(--ink),.18)" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="${arcD}" fill="none" stroke="url(#goalGaugeGrad)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${arcLen}" stroke-dashoffset="${dashOffset}"/>
    </svg>
    <div class="goal-gauge-center">
      <div class="goal-gauge-label">КНИГИ</div>
      <div class="goal-gauge-value">${centerLabel}</div>
    </div>
  </div>
  <button class="goal-action-btn" onclick="${btnOnclick}">${btnLabel}</button>`;

  el.innerHTML=`<div class="goal-widget-inner">${tabs}${gauge}</div>`;
}

// Бублик мов і бублик жанрів — той самий малюнок; різняться лише підписи й
// те, з чого рахується сума. Тому геометрія живе в одному місці.
function _donutCardHTML(title,breakdown,total,center,emptyText){
  if(!total){
    return`<div class="stats-chart-card">
      <div class="stats-chart-title">${title}</div>
      <div style="text-align:center;color:var(--txt-4);font-size:12px;padding:20px 0">${emptyText}</div>
    </div>`;
  }
  const r=45,cx=60,cy=60,sw=22,circ=2*Math.PI*r,gapLen=breakdown.length>1?4:0;
  let acc=0;
  const arcs=breakdown.map(({count,color})=>{
    const len=circ*(count/total);
    const visLen=Math.max(0,len-gapLen);
    const offset=-acc;
    acc+=len;
    return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${visLen} ${circ-visLen}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const legend=breakdown.map(({label,color,count})=>
    `<div class="lang-legend-row"><span class="lang-dot" style="background:${color}"></span><span class="lang-legend-lbl">${label}</span><span class="lang-legend-val">${count}</span></div>`
  ).join('');
  return`<div class="stats-chart-card">
    <div class="stats-chart-title">${title}</div>
    <div class="lang-donut-row">
      <svg viewBox="0 0 120 120" class="lang-donut-svg">${arcs}
        <text x="60" y="54" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="800" style="fill:var(--txt-hi)">${total}</text>
        <text x="60" y="71" text-anchor="middle" font-size="9" font-weight="600" style="fill:var(--txt-3)">${center}</text>
      </svg>
      <div class="lang-legend">${legend}</div>
    </div>
  </div>`;
}
function renderLangDonutHTML(books){

function genreBreakdown(books){
  const counts={};
  books.forEach(b=>{if(b.genre)counts[b.genre]=(counts[b.genre]||0)+1;});
  return Object.entries(counts).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1])
    .map(([genre,count])=>({genre,label:genre,count,color:GENRE_COLORS[genre]||'#94a3b8'}));
}
function formatBreakdown(books){
  const counts={};
  books.forEach(b=>{const k=formatById(b.format)?b.format:'—';counts[k]=(counts[k]||0)+1;});
  return Object.entries(counts).filter(([,n])=>n>0)
    .map(([id,count])=>{const x=formatById(id);
      return{label:x?x.emoji+' '+x.label:'Не вказано',count,color:x?x.color:'#94a3b8'};})
    .sort((a,b)=>b.count-a.count);
}

const LOC_COLORS={oak:'#4ade80',pallet:'#38bdf8',forest:'#facc15',glade:'#a78bfa',butterfly:'#f472b6',caves:'#94a3b8',shore:'#fb923c'};
function renderLocationProgressHTML(d){
  const locs=ALL_KANTO_LOCS.filter(locId=>chainsForLoc(locId).length>0);
  const r=45,cx=60,cy=60,sw=22,circ=2*Math.PI*r;
  const segLen=circ/locs.length,gapLen=4;
  let caughtAll=0,totalAll=0;
  const arcs=locs.map((locId,i)=>{
    const total=chainsForLoc(locId).length;
    const unlocked=(d.unlockedLocs||[]).includes(locId);
    const caught=unlocked?caughtCountIn(d,[locId]):0;
    totalAll+=total;caughtAll+=caught;
    const frac=unlocked&&total?caught/total:0;
    const color=LOC_COLORS[locId];
    const segVis=Math.max(0,segLen-gapLen);
    const fillVis=Math.max(0,segLen*frac-gapLen);
    const offset=-(i*segLen);
    // every slice always shows its own color — dim for the not-yet-caught part
    // of the segment, full brightness for the caught part — so there's never a
    // generic gray "hole", just a dimmer version of that location's own hue.
    const track=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-opacity=".28" stroke-width="${sw}"
      stroke-dasharray="${segVis} ${circ-segVis}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    const fill=fillVis>0?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${fillVis} ${circ-fillVis}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})"/>`:'';
    return track+fill;
  }).join('');
  const legend=locs.map(locId=>{
    const loc=LOCS[locId];
    const total=chainsForLoc(locId).length;
    const unlocked=(d.unlockedLocs||[]).includes(locId);
    const caught=unlocked?caughtCountIn(d,[locId]):0;
    return`<div class="lang-legend-row">
      <span class="lang-dot" style="background:${unlocked?LOC_COLORS[locId]:'var(--txt-5)'}"></span>
      <span class="lang-legend-lbl">${loc.name}${unlocked?'':' 🔒'}</span>
      <span class="lang-legend-val">${unlocked?caught+'/'+total:'—'}</span>
    </div>`;
  }).join('');
  return`<div class="stats-chart-card">
    <div class="stats-chart-title">Прогрес по локаціях</div>
    <div class="lang-donut-row">
      <svg viewBox="0 0 120 120" class="lang-donut-svg">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:rgba(var(--ink),.16)" stroke-width="${sw}"/>
        ${arcs}
        <text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="800" style="fill:var(--txt-hi)">${caughtAll}/${totalAll}</text>
      </svg>
      <div class="lang-legend">${legend}</div>
    </div>
  </div>`;
}
